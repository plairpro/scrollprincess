<meta property="og:title" content="Девочка с лампой">
<meta property="og:description" content="Ночная башня, красный фонарь, скелеты, вороны и мотыльки. Листай, чтобы подниматься.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231B1D52'/%3E%3Ccircle cx='16' cy='18' r='9' fill='%23FFD27A' opacity='.35'/%3E%3Crect x='11' y='13' width='10' height='10' rx='2' fill='%23FFE2A0'/%3E%3Cpath d='M9 13h14l-3-4h-8z' fill='%23D9544A'/%3E%3Crect x='10' y='23' width='12' height='3' rx='1' fill='%23D9544A'/%3E%3C/svg%3E">
<title>Девочка с лампой</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@500;700;800&family=Great+Vibes&family=Marck+Script&display=swap">
<style>
/* Layout: full-screen night diorama; UI floats as cream paper bubbles. One deliberate night world, same in both themes. */
:root{
  --ink:#4A3F6B;          /* plum ink on cream */
  --ink-soft:#7D7299;
  --paper:#FFF8EA;        /* cream bubbles */
  --rose:#E88A7A;
  --lantern:#D9544A;      /* lantern red, the accent */
  --lantern-deep:#A83A36;
  --mint:#9ED8C4;
  --night:#1B1D52;
  --f-display:"Fredoka","Nunito",ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;
  --f-script:"Great Vibes","Marck Script","Segoe Script",cursive;
  --f-body:"Nunito",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{margin:0;background:var(--night);color:var(--ink);font-family:var(--f-body);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#sky,#stars,#stars2,#c{position:fixed;inset:0;width:100%;height:100%}
#sky{background:linear-gradient(to top,#5B5A94,#2E3272 45%,#15174A)}
#stars,#stars2{pointer-events:none;background-repeat:repeat;mix-blend-mode:screen}
#stars2{animation:twinkle 3.2s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.15}to{opacity:.9}}
#moon{position:fixed;top:calc(env(safe-area-inset-top,0px) + 96px);right:22%;width:64px;height:64px;border-radius:50%;box-shadow:-14px 8px 0 0 #FFF4C9;transform:rotate(-12deg);filter:drop-shadow(0 0 18px rgba(255,240,190,.55));pointer-events:none}
.shoot{position:fixed;height:2px;width:120px;border-radius:2px;background:linear-gradient(90deg,rgba(255,250,225,0),#FFF6D8);transform-origin:right center;pointer-events:none;opacity:0}
.shoot.go{animation:shoot 1.1s ease-out forwards}
@keyframes shoot{0%{opacity:0;translate:0 0}15%{opacity:1}100%{opacity:0;translate:-260px 120px}}
#c{display:block;touch-action:none;outline:none}

/* HUD */
.hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 0;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:5}
.pause{pointer-events:auto;width:44px;height:44px;border-radius:50%;border:0;background:var(--paper);box-shadow:0 4px 14px rgba(10,10,40,.35);display:grid;place-items:center;cursor:pointer}
.pause:focus-visible,.btn:focus-visible{outline:3px solid var(--mint);outline-offset:3px}
.pause svg{width:16px;height:16px}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:8px;margin-right:-16px}
.ribbon{display:flex;align-items:center;gap:8px;padding:8px 18px 8px 26px;background:var(--paper);color:var(--ink);font-family:var(--f-display);font-weight:600;font-size:22px;font-variant-numeric:tabular-nums;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,13px 50%);filter:drop-shadow(0 4px 10px rgba(10,10,40,.35))}
.ribbon svg{width:22px;height:22px;flex:none}
.ribbon.bump{animation:bump .35s ease}
@keyframes bump{40%{transform:scale(1.08)}}
.charges{display:flex;gap:6px;padding-right:16px;transition:opacity .4s;opacity:0}
.charges i{width:12px;height:12px;border-radius:50%;background:#FFD27A;box-shadow:0 0 10px #FFC060;transition:background .3s,box-shadow .3s}
.charges i.off{background:rgba(255,248,234,.25);box-shadow:none}

/* Panels */
.panel{position:fixed;inset:0;display:grid;place-items:center;padding:24px 16px;z-index:10;pointer-events:none}
.card{pointer-events:auto;width:min(360px,100%);background:var(--paper);border-radius:30px;padding:26px 24px 22px;box-shadow:0 20px 60px rgba(8,8,40,.5);text-align:center;display:flex;flex-direction:column;gap:14px;animation:rise .5s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{transform:translateY(16px);opacity:0}}
.card h1,.card h2{margin:0;font-family:var(--f-display);font-weight:600;text-wrap:balance;line-height:1.05;color:var(--ink)}
.card h1{font-size:40px;letter-spacing:-.5px}
.card h2{font-size:28px}
.card p{margin:0;font-size:15px;line-height:1.45;color:var(--ink-soft)}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{font-size:12.5px;font-weight:800;letter-spacing:.3px;padding:6px 10px;border-radius:99px;background:#E4F3EC;color:var(--ink)}
.btn{font:600 19px var(--f-display);color:#fff;background:var(--lantern);border:0;border-radius:99px;padding:14px 22px;cursor:pointer;box-shadow:0 6px 0 var(--lantern-deep);transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--lantern-deep)}
.btn.go{position:relative;isolation:isolate;align-self:center;font-size:24px;letter-spacing:.3px;padding:16px 38px;background:linear-gradient(135deg,#FF7A59,#FF4F8B);box-shadow:0 7px 0 #B8335E;transition:transform .15s,box-shadow .15s,background .2s}
.btn.go::after{content:"";position:absolute;inset:-4px;border-radius:inherit;background:inherit;filter:blur(16px);opacity:.55;z-index:-1;animation:glowpulse 1.8s ease-in-out infinite}
.btn.go:hover{background:linear-gradient(135deg,#FFC23A,#FF6A3D);box-shadow:0 9px 0 #C4541F;transform:translateY(-2px) scale(1.05)}
.btn.go:active{transform:translateY(5px) scale(.98);box-shadow:0 2px 0 #B8335E}
@keyframes glowpulse{50%{opacity:.9;transform:scale(1.06)}}
.title-card{width:min(290px,100%);padding:18px 20px 20px;gap:6px;border-radius:26px}
.title-card h1{font-family:var(--f-script);font-weight:400;font-size:52px;line-height:1.05;letter-spacing:0;padding-top:4px}
.title-card .subtitle{font:800 11.5px var(--f-body);letter-spacing:4px;text-transform:uppercase;color:var(--lantern-deep);margin-top:-2px}
.title-card p{font-size:13.5px;margin-top:6px}
.title-card .btn.go{font-size:20px;padding:12px 30px;margin-top:8px}
.btn.alt{background:#7D7299;box-shadow:0 6px 0 #5E5580}
.small{font-size:12.5px!important}
.big{font-family:var(--f-display);font-weight:600;font-size:64px;line-height:1;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:10px;font-variant-numeric:tabular-nums}
.big svg{width:40px;height:40px}
.best{font-weight:800;font-size:14px;letter-spacing:.4px;text-transform:uppercase;color:var(--lantern-deep)}
.newrec{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:99px;background:var(--lantern);color:#fff}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);transform:translate(-50%,20px);max-width:calc(100% - 32px);width:max-content;background:var(--paper);color:var(--ink);font-weight:800;font-size:15px;padding:12px 18px;border-radius:18px;box-shadow:0 10px 30px rgba(8,8,40,.45);opacity:0;transition:opacity .35s,transform .35s;z-index:6;text-align:center;text-wrap:balance}
.toast.on{opacity:1;transform:translate(-50%,0)}
.floor{position:fixed;left:0;right:0;top:30%;text-align:center;font-family:var(--f-display);font-weight:600;font-size:40px;color:var(--paper);text-shadow:0 3px 18px rgba(8,8,40,.6);opacity:0;transition:opacity .6s,transform .6s;transform:translateY(10px);pointer-events:none;z-index:4}
.floor.on{opacity:1;transform:none}
.floor small{display:block;font-family:var(--f-body);font-weight:800;font-size:13px;letter-spacing:2px;text-transform:uppercase;opacity:.9}
.sndpill{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 20px);z-index:6;border:0;border-radius:99px;padding:9px 14px;background:var(--paper);color:var(--ink);font:800 13px var(--f-body);box-shadow:0 6px 18px rgba(8,8,40,.4);cursor:pointer}
.dbg{position:fixed;left:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);font:12px/1.4 ui-monospace,Menlo,monospace;color:var(--ink);background:var(--paper);padding:6px 8px;border-radius:8px;z-index:7;white-space:pre}
.hint-arrow{display:inline-block;animation:nudge 1.4s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(-5px)}}
@media (prefers-reduced-motion:reduce){.card,.hint-arrow,.ribbon.bump,#stars2,.btn.go::after{animation:none}}
</style>
</head>
<body>


<div id="sky"></div>
<div id="stars"></div>
<div id="stars2"></div>
<div id="moon"></div>
<div class="shoot" id="shoot"></div>
<canvas id="c" tabindex="0" aria-label="Игровое поле: башня со спиральной лестницей"></canvas>

<div class="hud" id="hud" hidden>
  <button class="pause" id="pauseBtn" aria-label="Пауза">
    <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="2" width="3.6" height="12" rx="1.6" fill="#4A3F6B"/><rect x="9.4" y="2" width="3.6" height="12" rx="1.6" fill="#4A3F6B"/></svg>
  </button>
  <div class="right">
    <div class="ribbon" id="ribbon"><span id="score">0</span>
      <svg viewBox="0 0 24 24" aria-label="шагов"><g fill="#4A3F6B"><ellipse cx="7.5" cy="8" rx="3" ry="4.6"/><ellipse cx="7.5" cy="16.2" rx="2.2" ry="1.9"/><ellipse cx="16.5" cy="6" rx="3" ry="4.6"/><ellipse cx="16.5" cy="14.2" rx="2.2" ry="1.9"/></g></svg>
    </div>
    <div class="charges" id="charges" aria-label="Заряд лампы"><i></i><i></i><i></i></div>
  </div>
</div>

<div class="panel" id="titleP">
  <div class="card title-card">
    <h1>Принцесса Скролл</h1>
    <div class="subtitle">восхождение</div>
    <p>Управляй скроллом</p>
    <button class="btn go" id="startBtn">Пошли!</button>
    <p class="small" id="bestTitle" hidden></p>
  </div>
</div>

<div class="panel" id="overP" hidden>
  <div class="card">
    <h2>Лампа погасла</h2>
    <div class="big"><span id="overScore">0</span>
      <svg viewBox="0 0 24 24" aria-label="шагов"><g fill="#4A3F6B"><ellipse cx="7.5" cy="8" rx="3" ry="4.6"/><ellipse cx="7.5" cy="16.2" rx="2.2" ry="1.9"/><ellipse cx="16.5" cy="6" rx="3" ry="4.6"/><ellipse cx="16.5" cy="14.2" rx="2.2" ry="1.9"/></g></svg>
    </div>
    <div class="best" id="overBest"></div>
    <p id="overWhy"></p>
    <button class="btn" id="againBtn">Ещё раз</button>
    <p class="small">или просто начни листать</p>
  </div>
</div>

<div class="panel" id="pauseP" hidden>
  <div class="card">
    <h2>Пауза</h2>
    <p>Девочка присела отдохнуть на ступеньке.</p>
    <button class="btn" id="resumeBtn">Продолжить</button>
    <button class="btn alt" id="soundBtn">Звук: вкл</button>
  </div>
</div>

<button class="sndpill" id="sndPill" hidden><svg viewBox="0 0 16 16" aria-hidden="true" width="14" height="14" style="vertical-align:-2px;margin-right:6px"><path d="M2 6h3l4-3v10L5 10H2z" fill="#4A3F6B"/><path d="M11 5.5a3.5 3.5 0 0 1 0 5M12.6 3.5a6 6 0 0 1 0 9" stroke="#4A3F6B" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg>Нажми, чтобы включить звук</button>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="floor" id="floor"></div>
<div class="dbg" id="dbg" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const T = THREE;

/* ============================== CONFIG ============================== */
const CFG = {
  stepsPerRev: 24,
  H: 0.2,
  RIN: 2.3, ROUT: 4.0,
  base: -0.34,
  maxSpeed: 8,
  wheelK: 1/55,
  dragK: 1/28,

};
CFG.RMID = (CFG.RIN + CFG.ROUT) / 2;
const DA = Math.PI * 2 / CFG.stepsPerRev;
const L = CFG.RMID * DA;
const W = CFG.ROUT - CFG.RIN;

const PAL = {
  wall: 0x8C90C6, band: 0x7479B0, stone: 0x9DA2D2,
  cliff: 0xE3A08F, cliff2: 0xD9927F, grass: 0x6DB39A, grass2: 0x62A78F, frost: 0xEFF7F4,
  cliffCracked: 0xC98A7E, grassDry: 0xA8B98A, crack: 0x5E4A5E,
  wood: 0xB9895F, woodDark: 0x8E6446, glow: 0xFFD27A, frame: 0x6E5A7E,
  leaf: 0x2F6A63, leafTop: 0x4E9486, trunk: 0x7A5540, apple: 0xE0564B, pine: 0x1F3F52, pineTop: 0x2B5568,

  lanternRed: 0xD9544A, lanternDark: 0x9E3833, lanternMetal: 0x3E3A48, lampCore: 0xFFE2A0,

  gear: 0xD9B98A, gearTip: 0xD9544A, niche: 0x2C2748, cloud: 0x5E62A0
};

/* ============================== UTIL ============================== */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t * t * (3 - 2 * t);
const easeOut = t => 1 - (1 - t) * (1 - t);
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hash = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
function P(s, r, y = 0){ const a = s * DA; return new T.Vector3(r * Math.sin(a), s * CFG.H + y, r * Math.cos(a)); }
function place(o, s, r, y = 0){ o.position.copy(P(s, r, y)); o.rotation.y = s * DA; return o; } // local x = uphill tangent, local z = radial outward

const matCache = {};
function M(hex, extra){
  const key = hex + (extra ? JSON.stringify(extra) : '');
  if (!matCache[key]) matCache[key] = new T.MeshStandardMaterial(Object.assign({ color: hex, roughness: .88, metalness: 0 }, extra || {}));
  return matCache[key];
}
function B(hex, extra){ return new T.MeshBasicMaterial(Object.assign({ color: hex }, extra || {})); }
function mesh(geo, mat, x = 0, y = 0, z = 0, parent){ const m = new T.Mesh(geo, mat); m.position.set(x, y, z); if (parent) parent.add(m); return m; }
const UP = new T.Vector3(0, 1, 0);
function cylBetween(a, b, r0, r1, mat, seg = 8){
  const d = new T.Vector3().subVectors(b, a); const len = d.length();
  const m = new T.Mesh(new T.CylinderGeometry(r1, r0, len, seg), mat);
  m.position.copy(a).addScaledVector(d, .5);
  m.quaternion.setFromUnitVectors(UP, d.normalize());
  return m;
}
function shadowAll(o, cast = true, recv = false){ o.traverse(c => { if (c.isMesh){ c.castShadow = cast; c.receiveShadow = recv; } }); }
function lerpHex(a, b, t){ return new T.Color(a).lerp(new T.Color(b), t); }
const sphere = (r, w = 14, h = 10) => new T.SphereGeometry(r, w, h);

/* ============================== AUDIO ============================== */
const MUS = {
  E8: 60 / 72 / 2, // eighth note at 72 bpm
  CH: {
    C:  { bass: 36, pad: [55, 60, 64, 71] },   // Cmaj7
    Am: { bass: 33, pad: [55, 60, 64, 69] },   // Am7
    F:  { bass: 41, pad: [57, 60, 64, 65] },   // Fmaj7
    G:  { bass: 43, pad: [55, 59, 62, 64] },   // G6
    Em: { bass: 40, pad: [55, 59, 62, 64] },   // Em7
    Dm: { bass: 38, pad: [53, 57, 60, 64] },   // Dm9
    Fm: { bass: 41, pad: [56, 60, 63, 65] }    // Fm6, a soft minor turn
  },
  PROGS: [['C', 'Am', 'F', 'G'], ['F', 'G', 'Em', 'Am'], ['Dm', 'G', 'C', 'Am'], ['F', 'Em', 'Dm', 'C'], ['Am', 'F', 'C', 'G'], ['C', 'F', 'Fm', 'C']],
  SCALE: [60, 62, 64, 67, 69, 72, 74, 76, 79, 81, 84]
};
const AU = {
  ctx: null, master: null, enabled: store.get('lg_sound', true), padNodes: null,
  init(){
    if (this.ctx){ if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
      try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch(e){}
      this.ctx = new C({ latencyHint: 'interactive' });
      const comp = this.ctx.createDynamicsCompressor();
      comp.threshold.value = -20; comp.knee.value = 18; comp.ratio.value = 4; comp.attack.value = .004; comp.release.value = .25;
      this.post = this.ctx.createGain(); this.post.gain.value = this.mobile ? 1.8 : 1.3;
      comp.connect(this.post); this.post.connect(this.ctx.destination);
      this.master = this.ctx.createGain(); this.master.gain.value = this.enabled ? .75 : 0; this.master.connect(comp);
      const len = this.ctx.sampleRate; const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate); const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.noiseBuf = buf;
      this.startMusic();
    } catch(e){ this.ctx = null; }
  },
  mobile: /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1),
  ios: /iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1),
  // Called from real taps/clicks/keys: creates or resumes the context and wakes iOS audio.
  unlock(){
    this.init(); if (!this.ctx) return;
    if (this.ctx.state !== 'running') this.ctx.resume().catch(() => {});
    try { const b = this.ctx.createBuffer(1, 1, 22050), src = this.ctx.createBufferSource(); src.buffer = b; src.connect(this.ctx.destination); src.start(0); } catch(e){}
    if (this.ios && !this.silentEl){ // a silent looping <audio> puts iOS into playback mode, so the mute switch no longer silences the game
      try {

  setEnabled(v){ this.enabled = v; store.set('lg_sound', v); if (this.master) this.master.gain.setTargetAtTime(v ? .75 : 0, this.ctx.currentTime, .05); },
  ok(){ return this.ctx && this.ctx.state === 'running'; },
  tone(f, type, dur, peak, when = 0, slide){

    const o = c.createOscillator(), g = c.createGain(); o.type = type; o.frequency.setValueAtTime(f, t);

  step(h){ this.noise(.05, .035, 'bandpass', 1100 + Math.random() * 400, 2); if (this.music) this.tone(this.mf(this.chordTone()), 'sine', .25, .012); },
  musicBox(){ [659.3, 784, 987.8, 1174.7, 987.8, 1318.5].forEach((f, i) => { this.tone(f, 'triangle', .9, .07, i * .16); this.tone(f * 2, 'sine', .5, .015, i * .16); }); },

  start(){ [523.3, 659.3, 784].forEach((f, i) => this.tone(f, 'triangle', .6, .06, i * .09)); },
  /* ---- generative night music: chord progressions, bass, music-box melody, echo ---- */
  startMusic(){
    const c = this.ctx;
    const bus = c.createGain(); bus.gain.value = 0; bus.connect(this.master);
    const dly = c.createDelay(1.5); dly.delayTime.value = .42;

    bus.connect(dly); dly.connect(dlp); dlp.connect(fb); fb.connect(dly); dlp.connect(wet); wet.connect(this.master);
    bus.gain.setTargetAtTime(1, c.currentTime, 1.5);
    this.music = { bus, prog: Math.floor(Math.random() * MUS.PROGS.length), idx: 0, beat: 0, next: c.currentTime + .3, mel: 72, cur: MUS.CH.C, lastBell: 0 };
    setInterval(() => this.schedule(), 60);

  mf(n){ return 440 * Math.pow(2, (n - 69) / 12); },
  voice(type, f, t, attack, hold, release, peak, dest, detune = 0){

    g.gain.setValueAtTime(peak, t + attack + hold); g.gain.linearRampToValueAtTime(0, t + attack + hold + release);

  pluck(type, f, t, decay, peak, dest){

  bell(n, t, peak){ const f = this.mf(n), d = this.music.bus; this.pluck('triangle', f, t, 1.8, peak, d); this.pluck('sine', f * 2, t, 1.1, peak * .28, d); this.pluck('sine', f * 3.01, t, .5, peak * .08, d); },
  padChord(ch, t, dur){

  },
  newProg(){ if (!this.music) return; let p; do p = Math.floor(Math.random() * MUS.PROGS.length); while (p === this.music.prog && MUS.PROGS.length > 1); this.music.prog = p; this.music.idx = 0; },

  },
  eighth(t){
    const m = this.music, pos = m.beat % 16;

    }
    m.beat++;
  },
  chordTone(){ const ch = this.music ? this.music.cur : MUS.CH.C; return ch.pad[Math.floor(Math.random() * ch.pad.length)] + 12; },
  duck(on){ if (this.music) this.music.bus.gain.setTargetAtTime(on ? .35 : 1, this.ctx.currentTime, .3); }
};

function stepBody(parent, j, z = 0, width = W, cliff, grass){
  const g = new T.Group(); g.position.z = z; parent.add(g);
  const cg = width === W ? cliffGeo : new T.BoxGeometry(L * 1.07, .46, width);
  const gg = width === W ? grassGeo : new T.BoxGeometry(L * 1.09, .08, width + .06);

  const gr = mesh(gg, M(grass || (j % 2 ? PAL.grass : PAL.grass2)), 0, -.035, 0, g); gr.receiveShadow = true;
  if (width === W || z > 0) mesh(frostGeo, M(PAL.frost), 0, .005, width / 2 - .02, g);
  return g;
}
function addRail(g, j){
  const post = mesh(postGeo, M(PAL.wood), 0, .28, W / 2 - .12, g); post.castShadow = true;
  mesh(new T.SphereGeometry(.055, 8, 6), M(PAL.woodDark), 0, .58, W / 2 - .12, g);
  const piv = new T.Group(); piv.position.set(0, .5, W / 2 - .12); piv.rotation.y = DA / 2; g.add(piv);
  const r = mesh(railGeo, M(PAL.wood), railLen / 2, CFG.H / 2, 0, piv); r.rotation.z = Math.atan2(CFG.H, railLen);
  const r2 = mesh(railGeo, M(PAL.woodDark), railLen / 2, CFG.H / 2 - .22, 0, piv); r2.rotation.z = r.rotation.z;
}
function addWindow(parent, y, z, big){

  mesh(new T.PlaneGeometry(w, h), winGlow, 0, 0, .015, g);
  mesh(new T.CircleGeometry(w / 2, 14, 0, Math.PI), winGlow, 0, h / 2, .015, g);

function roundTree(apples, sc = 1){
  const t = new T.Group();
  mesh(new T.CylinderGeometry(.09, .13, .7, 8), M(PAL.trunk), 0, .35, 0, t);
  const lv = [[0, .95, 0, .52], [-.22, .78, .12, .38], [.24, .8, -.06, .4], [.02, 1.28, -.02, .38]];
  lv.forEach(([x, y, z, r], i) => { const m = mesh(sphere(r, 12, 9), M(i === 3 ? PAL.leafTop : PAL.leaf), x, y, z, t); m.scale.y = .82; });
  if (apples) for (let i = 0; i < 4; i++){ const a = i * 1.7; mesh(sphere(.07, 8, 6), M(PAL.apple), Math.cos(a) * .42, .9 + (i % 2) * .22, Math.sin(a) * .42 + .1, t); }

function pine(sc = 1){
  const t = new T.Group(); mesh(new T.CylinderGeometry(.08, .1, .4, 6), M(PAL.trunk), 0, .2, 0, t);
  [[.7, .9, .55], [.55, .75, 1.05], [.38, .6, 1.5]].forEach(([r, h, y], i) => mesh(new T.ConeGeometry(r, h, 9), M(i === 2 ? PAL.pineTop : PAL.pine), 0, y, 0, t));

function makeStep(j){
  const g = new T.Group(); place(g, j, CFG.RMID);
  stepBody(g, j);
  addRail(g, j);
  const h = hash(j);
  const hasWin = i => hash(i) < .15;
  if (!hasWin(j) && !hasWin(j - 1) && !hasWin(j + 1) && hash(j * 2.3) < .45){ // stones on the wall, never near a window
    const n = 1 + (hash(j * 4.1) < .4 ? 1 : 0);
    for (let q = 0; q < n; q++) mesh(new T.BoxGeometry(.32 + hash(j + q * 7) * .3, .18, .06), M(hash(j + q) < .5 ? PAL.band : PAL.stone), (hash(j * 3 + q) - .5) * .3, .8 + hash(j * 5 + q) * 1.5, -W / 2 + .03, g);
  }
  if (h < .15) addWindow(g, 1.25 + hash(j + 3) * .5, -W / 2 + .08, hash(j + 5) < .4);
  else if (h > .9){ // flowers by the wall
    for (let n = 0; n < 4; n++){ const f = mesh(sphere(.05, 6, 5), M(n % 2 ? PAL.flower : PAL.flower2), (n - 1.5) * .12, .05 + (n % 2) * .03, -W / 2 + .22 + (n % 2) * .08, g); mesh(new T.CylinderGeometry(.008, .008, .06, 4), M(PAL.grass2), f.position.x, .02, f.position.z, g); }
  } else if (h > .83){ // candle lantern by the wall
    mesh(new T.CylinderGeometry(.06, .07, .05, 8), M(PAL.lanternMetal), -.1, .025, -W / 2 + .16, g);
    mesh(new T.CylinderGeometry(.045, .045, .1, 8), B(PAL.glow), -.1, .1, -W / 2 + .16, g).userData.flame = true;
    mesh(new T.ConeGeometry(.07, .06, 8), M(PAL.lanternRed), -.1, .18, -W / 2 + .16, g);
  } else if (h > .4 && h < .47){ // grassy ledge with a round tree outside the fence
    const lg = new T.Group(); lg.position.set(0, -.25, W / 2 + .55); g.add(lg);
    mesh(new T.CylinderGeometry(.62, .45, .5, 12), M(PAL.cliff), 0, -.05, 0, lg).castShadow = true;
    mesh(new T.CylinderGeometry(.66, .64, .08, 12), M(PAL.grass), 0, .22, 0, lg);
    mesh(new T.TorusGeometry(.64, .035, 5, 16), M(PAL.frost), 0, .25, 0, lg).rotation.x = Math.PI / 2;
    const t = roundTree(hash(j + 11) < .5, .75 + hash(j + 2) * .2); t.position.y = .25; lg.add(t);
  }
  tower.add(g); return g;
}
function syncSteps(s){
  const lo = Math.floor(s) - CFG.buildBehind, hi = Math.floor(s) + CFG.buildAhead;
  for (const [j, g] of steps){ if (j < lo || j > hi){ tower.remove(g); steps.delete(j); } }
  for (let j = Math.max(-6, lo); j <= hi; j++){ if (!steps.has(j) && !skipSteps.has(j)) steps.set(j, makeStep(j)); }
}
function clearSteps(){ for (const [, g] of steps) tower.remove(g); steps.clear(); }

/* ---- 1. Skeleton ---- */
function Skeleton(k, first){
  const C = CFG.HAZ.skeleton; const rnd = mulberry32(k * 7 + 1);
  const root = new T.Group(); place(root, k, CFG.RMID + .05); tower.add(root);
  const tmp = new T.Group(); tmp.rotation.y = -Math.PI / 2 + .55; root.add(tmp);
  const pieces = []; const bm = M(PAL.bone, { roughness: .7 }), bs = M(PAL.boneShade, { roughness: .7 });
  const add = (geo, m, x, y, z, rz = 0) => { const me = mesh(geo, m, x, y, z, tmp); me.rotation.z = rz; me.castShadow = true; pieces.push(me); return me; };
  const skull = add(sphere(.15, 14, 12), bm, 0, 1.08, 0); skull.scale.set(1, .95, 1.05);
  [-1, 1].forEach(sd => { mesh(sphere(.042, 8, 6), M(0x3A3358), sd * .055, .01, .12, skull); mesh(sphere(.017, 6, 5), B(PAL.eye), sd * .055, .012, .158, skull); });
  add(new T.BoxGeometry(.16, .05, .12), bs, 0, .94, .03);
  add(new T.CylinderGeometry(.025, .025, .42, 6), bs, 0, .68, -.02);
  for (let i = 0; i < 3; i++){ const rib = add(new T.TorusGeometry(.12 - i * .014, .018, 5, 12, Math.PI * 1.4), bm, 0, .84 - i * .075, 0); rib.rotation.x = Math.PI / 2; }
  add(new T.BoxGeometry(.22, .08, .11), bm, 0, .45, 0);
  [-1, 1].forEach(sd => { add(new T.CylinderGeometry(.03, .025, .42, 6), bm, sd * .07, .22, 0); add(new T.CylinderGeometry(.025, .02, .42, 6), bm, sd * .17, .67, 0, sd * .15); add(new T.BoxGeometry(.07, .04, .12), bs, sd * .07, .02, .03); });
  root.updateMatrixWorld(true); pieces.forEach(p => root.attach(p)); root.remove(tmp);
  const data = pieces.map(p => {
    const x = (rnd() - .5) * 1.4, z = (rnd() - .5) * .9;
    const e = new T.Euler((rnd() < .6 ? Math.PI / 2 : 0) + (rnd() - .5) * .4, rnd() * 6.28, rnd() < .6 ? Math.PI / 2 : 0);
    return { m: p, A: { p: p.position.clone(), q: p.quaternion.clone() }, B: { p: new T.Vector3(x, Math.round(x / L) * CFG.H + .045, z), q: new T.Quaternion().setFromEuler(e) }, d: rnd() * .12 };
  });
  data[0].B.p.set(-L * .9, -CFG.H + .14, .2);
  const off = rnd() * 5; let last = '', danger = true;
  return {
    type: 'skeleton', k, len: 1, first,
    update(c){
      const sc = 1 - .22 * c.diff, st = C.stand * sc, pi = C.pile * sc;
      const Pd = st + C.crumble + pi + C.tremble + C.assemble; let tt = ((c.t + off) % Pd + Pd) % Pd;
      let f = 0, trem = 0, state, loc = 0;
      if (tt < st) state = 'stand';
      else if ((tt -= st) < C.crumble){ state = 'crumble'; f = tt / C.crumble; }
      else if ((tt -= C.crumble) < pi){ state = 'pile'; f = 1; }
      else if ((tt -= pi) < C.tremble){ state = 'tremble'; f = 1; trem = tt / C.tremble; }
      else { tt -= C.tremble; loc = tt / C.assemble; state = 'assemble'; f = 1 - loc; }
      danger = state === 'stand' || (state === 'crumble' && f < .3) || (state === 'assemble' && loc > .55);
      if (state !== last && Math.abs(c.s - k) < 9){
        if (state === 'crumble') AU.rattle(clamp(1.2 - Math.abs(c.s - k) / 8, .2, 1));
        if (state === 'tremble') AU.rattle(.35);
        if (state === 'assemble') AU.rattle(.6);
      }
      last = state;
      const up = state === 'assemble';
      for (const d of data){
        const fi = clamp(f * 1.14 - d.d, 0, 1), e = up ? ease(fi) : easeOut(fi);
        d.m.position.lerpVectors(d.A.p, d.B.p, e);

      }

    },
    deadly(s){ return danger && Math.abs(s - k) < .55; },
    dispose(){ tower.remove(root); }
  };
}

/* ---- 2. Raven on the rail: attacks anyone who runs past, only a calm walk is safe ---- */
function RavenPerch(k, first){
  const C = CFG.HAZ.raven;
  const root = new T.Group(); place(root, k, CFG.ROUT - .12, .6 + .12); tower.add(root);
  const r = buildRaven(1); r.g.rotation.y = -Math.PI / 4; root.add(r.g);
  const bang = bangSprite(); bang.position.set(0, .45, 0); root.add(bang);
  let state = 'perch', tm = 0; const prev = new T.Vector3(), tgt = new T.Vector3();
  return {
    type: 'raven', k, len: 1, first,
    update(c){
      const thr = lerp(C.thr, C.thrMin, c.diff);
      const d = k - c.s, near = d > -1.4 && d < 3.8;
      tm += c.dt;
      if (state === 'perch'){
        flap(r, c.t, 0, 0, 1);
        r.head.rotation.y = near ? clamp(-d * .25, -.8, .3) : Math.sin(c.t * .7 + k) * .4;
        const nerv = near && c.speed > thr * .6;
        r.inner.position.y = nerv ? Math.abs(Math.sin(c.t * 30)) * .025 : 0;
        bang.visible = nerv; if (nerv) bang.scale.setScalar(.34 + (c.speed / thr) * .08);
        if (near && c.speed > thr && G.state === 'play'){ state = 'alert'; tm = 0; AU.caw(1); }
      } else if (state === 'alert'){
        r.inner.position.y = -.05; r.wings.forEach((w, i) => w.rotation.z = (i ? 1 : -1) * (-.5 + Math.sin(c.t * 30) * .2));
        bang.visible = true; bang.scale.setScalar(.5);
        if (tm > C.alert){ state = 'swoop'; tm = 0; bang.visible = false; tower.attach(r.g); prev.copy(r.g.position); }
      } else if (state === 'swoop'){
        // homes in on the princess; once it has launched it will not miss
        girlCenterAt(c.s); tgt.copy(girlCenter);
        const pos = r.g.position; const dir = tgt.clone().sub(pos); const dl = dir.length();
        if (dl > 1e-4) pos.addScaledVector(dir, Math.min(1, C.swoopSpeed * c.dt / dl));
        pos.y += Math.sin(tm * 18) * .01;
        const mv = pos.clone().sub(prev); if (mv.lengthSq() > 1e-7) r.g.lookAt(tower.localToWorld(pos.clone().add(mv)));
        prev.copy(pos); flap(r, c.t, 24, .95);
        if (G.state !== 'play' && tm > .6){ state = 'leave'; tm = 0; }
      } else if (state === 'leave'){
        r.g.position.add(new T.Vector3(0, 2.2 * c.dt, 0)).addScaledVector(r.g.position.clone().setY(0).normalize(), 2.5 * c.dt);
        flap(r, c.t, 16, .8); if (tm > 2.5) r.g.visible = false;
      }
    },
    deadly(s){ if (state !== 'swoop') return false; girlCenterAt(s); return r.g.position.distanceTo(girlCenter) < .5; },
    dispose(){ tower.remove(root); if (r.g.parent) r.g.parent.remove(r.g); }
  };
}

/* ---- 3. Flock crossing ---- */
function Flock(k, first){
  const C = CFG.HAZ.flock; const rnd = mulberry32(k * 13 + 5);
  const g = new T.Group(); tower.add(g);
  const birds = []; for (let i = 0; i < 7; i++){ const r = buildRaven(.85); r.g.visible = false; g.add(r.g); birds.push({ r, s: k - .2 + i * .42 + (rnd() - .5) * .2, dt: (rnd() - .5) * .16, rr: (rnd() - .5) * .5 }); }
  const shadows = []; const shM = new T.MeshBasicMaterial({ color: 0x1A1640, transparent: true, opacity: 0, depthWrite: false });
  for (let j = 0; j < 3; j++){ const sh = new T.Mesh(new T.CircleGeometry(.42, 16), shM); sh.rotation.x = -Math.PI / 2; sh.position.copy(P(k + j, CFG.RMID, .02)); g.add(sh); shadows.push(sh); }
  const off = rnd() * 5; let danger = false, lastPh = '';
  return {
    type: 'flock', k, len: 3, first,
    update(c){
      const Pd = C.period * (1 - .2 * c.diff); const tt = ((c.t + off) % Pd + Pd) % Pd; const q = Pd - C.tele - C.pass;
      let ph = 'quiet', u = 0;
      if (tt >= q && tt < q + C.tele){ ph = 'tele'; u = (tt - q) / C.tele; }
      else if (tt >= q + C.tele){ ph = 'pass'; u = (tt - q - C.tele) / C.pass; }
      if (ph !== lastPh && ph === 'tele' && Math.abs(c.s - k) < 9) AU.wings(clamp(1.3 - Math.abs(c.s - k) / 8, .2, 1));
      lastPh = ph;
      shM.opacity = ph === 'tele' ? .1 + .35 * u : ph === 'pass' ? .45 * (1 - clamp((u - .5) * 2, 0, 1)) : 0;
      shadows.forEach((sh, i) => { const sc = ph === 'tele' ? .6 + .5 * u + Math.sin(c.t * 9 + i) * .05 : 1.1; sh.scale.set(sc, sc, 1); });
      danger = ph === 'pass' && u > .32 && u < .68;
      for (const b of birds){
        if (ph !== 'pass'){ b.r.g.visible = false; continue; }
        const uu = clamp(u + b.dt, 0, 1); b.r.g.visible = uu > 0 && uu < 1;
        const rad = v => lerp(9.5, CFG.RMID + b.rr, Math.sin(v * Math.PI));
        const pos = P(b.s, rad(uu), .95 + (.5 - uu) * 7); const nxt = P(b.s, rad(Math.min(1, uu + .02)), .95 + (.5 - uu - .02) * 7);
        b.r.g.position.copy(pos); b.r.g.lookAt(tower.localToWorld(nxt)); flap(b.r, c.t + b.s, 20, .8);
      }
    },
    deadly(s){ return danger && s > k - .55 && s < k + 2.55; },
    dispose(){ tower.remove(g); }
  };
}

/* ---- 4. Crumbling steps ---- */
function Crumble(k, first){
  const C = CFG.HAZ.crumble; const n = 4; const rnd = mulberry32(k * 17 + 3);
  const items = [];
  for (let j = k; j < k + n; j++){
    skipSteps.add(j);
    const g = new T.Group(); place(g, j, CFG.RMID); tower.add(g);
    const inner = new T.Group(); g.add(inner);
    stepBody(inner, j, 0, W, PAL.cliffCracked, PAL.grassDry);
    for (let q = 0; q < 3; q++){ const cr = mesh(new T.BoxGeometry(.28 + rnd() * .3, .012, .03), M(PAL.crack), (rnd() - .5) * .5, .01, (rnd() - .5) * 1.2, inner); cr.rotation.y = (rnd() - .5) * 2; }
    const post = mesh(postGeo, M(PAL.woodDark), 0, .28, W / 2 - .12, g); post.rotation.z = .12;
    const chunks = []; for (let q = 0; q < 5; q++){ const ch = mesh(new T.DodecahedronGeometry(.13 + rnd() * .06, 0), M(PAL.cliffCracked, { flatShading: true }), 0, 0, 0, g); ch.visible = false; chunks.push({ m: ch, v: new T.Vector3() }); }
    items.push({ j, g, inner, chunks, state: 'ok', t: 0 });
  }
  return {
    type: 'crumble', k, len: n, first,
    update(c){
      const cur = Math.round(c.s);
      for (const it of items){
        it.t += c.dt;
        if (it.state === 'ok'){ it.inner.position.set(0, 0, 0); if (cur === it.j && G.state === 'play'){ it.state = 'shake'; it.t = 0; AU.crack(); } }
        else if (it.state === 'shake'){
          const a = .012 + it.t * .03; it.inner.position.set((Math.random() - .5) * a, (Math.random() - .5) * a * .6 - it.t * .03, (Math.random() - .5) * a);
          if (it.t > C.shake * (1 - .15 * c.diff)){ it.state = 'gone'; it.t = 0; it.inner.visible = false; AU.crumble(clamp(1.2 - Math.abs(c.s - it.j) / 6, .2, 1));
            it.chunks.forEach((ch, q) => { ch.m.visible = true; ch.m.position.set((q - 2) * .15, -.2, (Math.random() - .5) * 1.2); ch.v.set((Math.random() - .5) * .8, Math.random() * .8, (Math.random() - .5) * .6); }); }
        } else if (it.state === 'gone'){
          it.chunks.forEach(ch => { ch.v.y -= 9.8 * c.dt; ch.m.position.addScaledVector(ch.v, c.dt); ch.m.rotation.x += c.dt * 3; ch.m.rotation.z += c.dt * 2; if (it.t > 1.6) ch.m.visible = false; });
          if (it.t > C.gone){ it.state = 'restore'; it.t = 0; it.inner.visible = true; }
        } else if (it.state === 'restore'){
          const u = clamp(it.t / C.restore, 0, 1); it.inner.scale.set(1, Math.max(.02, easeOut(u) * (1 + Math.sin(u * Math.PI) * .15)), 1); it.inner.position.set(0, (1 - u) * -.3, 0);
          if (u >= 1){ it.state = 'ok'; it.t = 0; it.inner.scale.set(1, 1, 1); }
        }
      }
    },
    deadly(s){ const cur = Math.round(s); const it = items.find(i => i.j === cur); return !!it && (it.state === 'gone' || (it.state === 'restore' && it.t < C.restore * .5)); },
    dispose(){ items.forEach(it => { tower.remove(it.g); skipSteps.delete(it.j); }); }
  };
}

/* ---- 5. Moth swarm over the stairs: run through fast, linger and they bite ---- */
function Moths(k, first){
  const C = CFG.HAZ.moths; const rnd = mulberry32(k * 23 + 9);
  const g = new T.Group(); tower.add(g);
  const home = P(k, CFG.RMID, 1.05); const center = home.clone();
  const ms = [];
  for (let i = 0; i < 22; i++){
    const m = new T.Group(); g.add(m);
    const wm = new T.MeshBasicMaterial({ color: PAL.moth[i % 4], side: T.DoubleSide });
    const wl = mesh(new T.CircleGeometry(.065, 3), wm, -.04, 0, 0, m), wr = mesh(new T.CircleGeometry(.065, 3), wm, .04, 0, 0, m);
    mesh(sphere(.02, 5, 4), B(0xFFF6DE), 0, 0, 0, m);
    ms.push({ m, wl, wr, r: .2 + rnd() * .45, sp: 2 + rnd() * 2.5, ph: rnd() * 6.28, yv: (rnd() - .5) * .5 });
  }
  const halo = new T.Sprite(new T.SpriteMaterial({ map: dotTex, color: 0xFFF0C8, transparent: true, depthWrite: false, blending: T.AdditiveBlending, opacity: .5 })); halo.scale.set(1.8, 1.8, 1); g.add(halo);
  let slow = 0, killed = false, buzzT = 0; const tgt = new T.Vector3();
  return {
    type: 'moths', k, len: 1, first,
    update(c){
      const dist = Math.abs(c.s - k), inZone = dist < C.zone && G.state === 'play';
      const fast = lerp(C.fast, C.fast + .8, c.diff);
      if (inZone && !killed){ if (c.speed < fast) slow += c.dt; else slow = Math.max(0, slow - c.dt * 2); } else if (!killed) slow = 0;
      if (!killed && slow > C.grace){ killed = true; AU.chime(); AU.noise(.6, .08, 'bandpass', 2600, 2); }
      const agitated = dist < 3.2;
      if (agitated && (buzzT -= c.dt) <= 0){ buzzT = .5; if (G.state === 'play') AU.noise(.25, .018 * (1.2 - dist / 3.2), 'bandpass', 3200 + Math.random() * 800, 6); }
      if (killed){ girlCenterAt(c.s); tgt.copy(girlCenter); } else tgt.copy(home);
      center.lerp(tgt, 1 - Math.exp(-c.dt * (killed ? 14 : 3)));
      halo.position.copy(center); halo.material.opacity = agitated ? .75 : .45;
      const spd = agitated ? 1.8 : 1, tight = killed ? .45 : 1;
      for (const q of ms){
        const a = c.t * q.sp * spd + q.ph; const rr = q.r * tight;
        q.m.position.set(center.x + Math.cos(a) * rr, center.y + Math.sin(a * 1.3) * rr * .7 + q.yv * Math.sin(c.t + q.ph), center.z + Math.sin(a) * rr);
        q.m.lookAt(camera.position);
        const f = Math.sin(c.t * 34 + q.ph) * .9; q.wl.rotation.y = f; q.wr.rotation.y = -f;
      }
    },
    deadly(){ return killed; },
    dispose(){ tower.remove(g); }
  };
}

/* ---- 6. Skeleton hand from a niche ---- */
function Hand(k, first){
  const C = CFG.HAZ.hand; const rnd = mulberry32(k * 31 + 7);
  const g = new T.Group(); place(g, k, CFG.RIN); tower.add(g);
  mesh(new T.PlaneGeometry(.62, .55), B(PAL.niche), 0, .5, .012, g);
  mesh(new T.CircleGeometry(.31, 14, 0, Math.PI), B(PAL.niche), 0, .775, .012, g);
  mesh(new T.BoxGeometry(.8, .08, .12), M(PAL.band), 0, .21, .05, g);
  [-1, 1].forEach(sd => mesh(new T.BoxGeometry(.08, .62, .1), M(PAL.band), sd * .36, .52, .04, g));
  mesh(new T.TorusGeometry(.35, .045, 6, 14, Math.PI), M(PAL.band), 0, .8, .04, g);
  const arm = new T.Group(); arm.position.set(0, .55, 0); g.add(arm);
  const bm = M(PAL.bone, { roughness: .7 }), bs = M(PAL.boneShade, { roughness: .7 });
  const fore = mesh(new T.CylinderGeometry(.035, .04, 1.4, 8), bm, 0, 0, -.7, arm); fore.rotation.x = Math.PI / 2;
  mesh(sphere(.06, 8, 6), bs, 0, 0, 0, arm);
  mesh(new T.BoxGeometry(.2, .05, .18), bm, 0, 0, .1, arm);
  const fingers = [];
  for (let i = 0; i < 4; i++){ const fp = new T.Group(); fp.position.set(-.075 + i * .05, 0, .19); arm.add(fp); const f = mesh(new T.CylinderGeometry(.016, .014, .17, 6), bm, 0, 0, .085, fp); f.rotation.x = Math.PI / 2; fingers.push(fp); }
  const th = new T.Group(); th.position.set(.11, 0, .08); th.rotation.y = .8; arm.add(th); mesh(new T.CylinderGeometry(.016, .014, .13, 6), bm, 0, 0, .06, th).rotation.x = Math.PI / 2;
  shadowAll(arm, true);
  const dust = []; for (let i = 0; i < 7; i++){ const d = mesh(new T.BoxGeometry(.035, .035, .035), M(0xC7C3E6), 0, 0, 0, g); d.visible = false; dust.push({ m: d, x: (rnd() - .5) * .5, s: .6 + rnd() * .6, o: rnd() }); }
  const reach = (CFG.RMID + .5) - CFG.RIN; const off = rnd() * 4; let ext = 0, last = '';
  return {
    type: 'hand', k, len: 1, first,
    update(c){
      const Pd = C.period * (1 - .2 * c.diff); let tt = ((c.t + off) % Pd + Pd) % Pd; const hid = Pd - C.tele - C.out - C.hold - C.back;
      let ph, close = 0;
      if (tt < hid){ ph = 'hid'; ext = 0; }
      else if ((tt -= hid) < C.tele){ ph = 'tele'; ext = .06 + Math.sin(tt * 30) * .02; }
      else if ((tt -= C.tele) < C.out){ ph = 'out'; ext = easeOut(tt / C.out); }
      else if ((tt -= C.out) < C.hold){ ph = 'hold'; ext = 1; close = clamp(tt / .18, 0, 1); }
      else { tt -= C.hold; ph = 'back'; ext = 1 - ease(tt / C.back); close = 1; }
      if (ph !== last && Math.abs(c.s - k) < 9){ if (ph === 'tele') AU.dust(clamp(1.3 - Math.abs(c.s - k) / 7, .2, 1)); if (ph === 'hold') AU.rattle(.4); }
      last = ph;
      arm.position.z = -.2 + ext * reach; arm.visible = ext > .02 || ph === 'tele';
      fingers.forEach((f, i) => f.rotation.x = close * 1.2 + (ph === 'tele' ? Math.sin(c.t * 14 + i) * .3 : 0));
      dust.forEach(d => { d.m.visible = ph === 'tele'; if (d.m.visible){ const y = ((c.t * d.s + d.o) % 1); d.m.position.set(d.x, 1.05 - y * .9, .12); } });
    },
    deadly(s){ return ext > .5 && Math.abs(s - k) < .6; },
    dispose(){ tower.remove(g); }
  };
}

/* ---- 7. Clockwork wheel through a slot ---- */
function Gear(k, first){
  const C = CFG.HAZ.gear; const n = C.teeth; const Rg = 1.55, cy = -1.0, slotZ = .45;
  const g = new T.Group(); tower.add(g);
  const inW = (slotZ - .2) + W / 2, outW = W / 2 - (slotZ + .2);
  for (let j = k - 1; j <= k + 1; j++){
    skipSteps.add(j);
    const sg = new T.Group(); place(sg, j, CFG.RMID); g.add(sg);
    stepBody(sg, j, -W / 2 + inW / 2, inW);
    stepBody(sg, j, W / 2 - outW / 2, outW);
    addRail(sg, j);
  }
  const holder = new T.Group(); place(holder, k, CFG.RMID + slotZ, cy); g.add(holder);
  const rotor = new T.Group(); holder.add(rotor);
  mesh(new T.CylinderGeometry(.42, .42, .36, 18), M(PAL.gear, { metalness: .3, roughness: .5 }), 0, 0, 0, rotor).rotation.x = Math.PI / 2;
  mesh(new T.CylinderGeometry(.16, .16, .4, 12), M(PAL.gearTip), 0, 0, 0, rotor).rotation.x = Math.PI / 2;
  mesh(new T.TorusGeometry(Rg * .62, .06, 6, 24), M(PAL.gear, { metalness: .3, roughness: .5 }), 0, 0, 0, rotor);
  for (let i = 0; i < n; i++){
    const arm = new T.Group(); arm.rotation.z = i * Math.PI * 2 / n; rotor.add(arm);
    mesh(new T.BoxGeometry(.13, Rg - .1, .3), M(PAL.gear, { metalness: .3, roughness: .5 }), 0, (Rg - .1) / 2, 0, arm);
    mesh(new T.BoxGeometry(.22, .18, .34), M(PAL.gearTip), 0, Rg - .1, 0, arm);
  }
  shadowAll(rotor, true);
  let lastTop = 0, ang = mulberry32(k)() * 6.28;
  return {
    type: 'gear', k, len: 3, first,
    update(c){
      ang += lerp(C.omega, C.omegaMax, c.diff) * c.dt;
      rotor.rotation.z = -ang;
      const top = Math.floor((ang + Math.PI / n) / (Math.PI * 2 / n));
      if (top !== lastTop){ lastTop = top; if (Math.abs(c.s - k) < 7) AU.tick(clamp(1.2 - Math.abs(c.s - k) / 6, .2, 1)); }
    },
    deadly(s){
      for (let i = 0; i < n; i++){
        let phi = ang + i * Math.PI * 2 / n; phi = Math.atan2(Math.sin(phi), Math.cos(phi));
        if (Rg * Math.cos(phi) + cy < .12) continue;
        if (Math.abs((s - k) - Rg * Math.sin(phi) / L) < .42) return true;
      }
      return false;
    },
    dispose(){ tower.remove(g); for (let j = k - 1; j <= k + 1; j++) skipSteps.delete(j); }
  };
}

const gen = { rng: null, next: 22, shown: {}, last: '' };
function resetGen(seed){ gen.rng = mulberry32(seed); gen.next = 22; gen.shown = {}; gen.last = ''; }
function generate(uptoS){
  while (gen.next < uptoS){
    const k = gen.next; const diff = clamp(k / 900, 0, 1);
    const unlocked = ORDER.filter(t => k >= CFG.HAZ[t].unlock);
    let type = unlocked.find(t => !gen.shown[t]);
    const first = !!type;
    if (!type){ const pool = unlocked.filter(t => t !== gen.last); type = pool[Math.floor(gen.rng() * pool.length)] || unlocked[0]; }
    gen.shown[type] = true; gen.last = type;
    const kk = type === 'gear' ? k + 1 : k;
    const h = MAKERS[type](kk, first); hazards.push(h);
    const len = type === 'gear' ? 4 : h.len;
    gen.next = k + len + (first ? 11 : Math.round(lerp(10, 5.5, diff) + gen.rng() * 3.5));
  }
}
function pruneHazards(s){ for (let i = hazards.length - 1; i >= 0; i--){ const h = hazards[i]; if (h.k + h.len < s - CFG.buildBehind + 2){ h.dispose(); hazards.splice(i, 1); } } }
function clearHazards(){ hazards.forEach(h => h.dispose()); hazards.length = 0; skipSteps.clear(); }

}

function updateGirl(dt){
  const g = girl, s = G.s;
  place(g.root, s, CFG.RMID, 0); g.root.rotation.y = s * DA + Math.PI / 2 - .32;
  const ph = s * Math.PI;
  const moving = G.speed > .15 && G.state === 'play';
  const amp = clamp(G.speed / 4, 0, 1);
  if (G.state === 'dead'){
    G.sit = Math.min(1, G.sit + dt * 2.2); const e = ease(G.sit);
    g.legs.forEach(l => l.rotation.x = lerp(l.rotation.x, -1.35, e));
    g.body.position.y = -.28 * e; g.body.rotation.x = .08 * e; g.head.rotation.x = .25 * e;
  } else {
    g.legs[0].rotation.x = moving ? Math.sin(ph) * .55 : 0;
    g.legs[1].rotation.x = moving ? -Math.sin(ph) * .55 : 0;
    g.body.position.y = moving ? Math.abs(Math.sin(ph)) * .035 : Math.sin(G.t * 2) * .006;
    g.body.rotation.x = 0; g.head.rotation.x = 0;
    g.dressG.rotation.z = moving ? Math.sin(ph) * .05 : 0;
  }
  g.back.rotation.x = -amp * .22 + Math.sin(G.t * 2.2) * .03; g.back.rotation.z = Math.sin(G.t * 1.6) * .03; g.strands.forEach(st => st.rotation.x = -amp * .2);
  g.lamp.rotation.z = Math.sin(G.t * 2.4 + s) * .12 * (moving ? 1.6 : .6);
  g.lamp.rotation.x = Math.sin(G.t * 1.7) * .06 - amp * .15;
  if (G.flicker > 0) G.flicker -= dt;
  const fl = G.flicker > 0 ? (Math.random() < .5 ? .2 : 1) : 1;
  const ch = G.state === 'dead' ? Math.max(0, 1 - G.deadT * 1.4) : (.3 + .7 * G.charges / 3);
  const base = lerp(1.5, 2.1, skyState.night) * (1 + Math.sin(G.t * 5.3) * .04 + Math.sin(G.t * 13.1) * .02);
  g.light.intensity = base * ch * fl;
  g.halo.material.opacity = .6 * ch * fl;
  g.coreMat.color.set(PAL.lampCore).multiplyScalar(.3 + .7 * ch * fl);
}

let lastT = performance.now(), fpsAcc = 0, fpsN = 0, fps = 60;
function frame(now){
  requestAnimationFrame(frame);
  let dt = (now - lastT) / 1000; lastT = now; dt = clamp(dt, 0, 1 / 20);
  fpsAcc += dt; fpsN++; if (fpsAcc > .5){ fps = Math.round(fpsN / fpsAcc); fpsAcc = 0; fpsN = 0; }
  const simDt = G.state === 'paused' ? 0 : dt;
  G.t += simDt;

  if (G.state === 'play'){
    let kv = 0; if (keys.ArrowUp || keys.ArrowRight) kv += 1; if (keys.ArrowDown || keys.ArrowLeft) kv -= 1;
    if (kv) G.pending = clamp(G.pending + kv * CFG.keySpeed * dt, -CFG.pendingCap, CFG.pendingCap);
    const maxMove = CFG.maxSpeed * dt;
    let move = clamp(G.pending, -maxMove, maxMove);
    if (G.s + move < 0){ move = -G.s; G.pending = 0; }
    G.pending -= move; if (Math.abs(G.pending) < .002) G.pending = 0;
    G.speed = lerp(G.speed, Math.abs(move) / Math.max(dt, 1e-4), 1 - Math.exp(-dt * 10));
    const sub = Math.max(1, Math.ceil(Math.abs(move) / .2));
    for (let i = 1; i <= sub && G.state === 'play'; i++){
      const ss = G.s + move * i / sub;
      for (const h of hazards){ if (Math.abs(h.k - ss) < 6 && h.deadly(ss)){ G.s = ss; die(h.type); break; } }
    }
    if (G.state === 'play') G.s += move;
    if (G.s > G.maxS) G.maxS = G.s;
    const stepI = Math.floor(G.s);
    if (stepI !== G.lastStep){ AU.step(stepI); G.lastStep = stepI; }
    const sc = String(Math.floor(G.maxS)); if (ui.score.textContent !== sc) ui.score.textContent = sc;
    const fl = Math.floor(G.maxS / 100); if (fl > G.floor){ G.floor = fl; floorBanner(fl + 1); AU.musicBox(); AU.newProg(); ui.ribbon.classList.remove('bump'); void ui.ribbon.offsetWidth; ui.ribbon.classList.add('bump'); }
    const anyChase = hazards.some(h => h.type === 'moths' && h.chasing);
    if (G.charges < 3 && !anyChase){ G.regen += dt; if (G.regen > 3.5){ G.regen = 0; G.charges++; renderCharges(); AU.lampBack(); } } else G.regen = 0;
    const mothNear = hazards.some(h => h.type === 'moths' && Math.abs(h.k - G.s) < 6);
    ui.charges.style.opacity = 0;
    for (const h of hazards){ if (h.first && !G.hinted[h.type] && h.k - G.s < 7 && h.k - G.s > -1){ G.hinted[h.type] = true; store.set('lg_hints', G.hinted); toast(HINTS[h.type]); } }
  } else if (G.state === 'dead'){
    G.deadT += dt; G.speed = 0;
    if (G.deadT > .9 && ui.overP.hidden) showOver();
  } else G.speed = 0;

  generate(G.s + CFG.genAhead); pruneHazards(G.s); syncSteps(G.s);
  updateSky(G.s);
  placeCamera(dt);
  updateGirl(dt);

  tower.updateMatrixWorld(true);
  girl.lcore.getWorldPosition(tmpV); lampLocal.copy(tower.worldToLocal(tmpV));
  const ctx = { t: G.t, dt: simDt, s: G.s, speed: G.speed, diff: clamp(G.s / 900, 0, 1), lamp: lampLocal };
  if (simDt > 0) for (const h of hazards) if (Math.abs(h.k - G.s) < 50) h.update(ctx);

  girl.root.getWorldPosition(tmpV);
  moonLight.position.set(tmpV.x + 3, tmpV.y + 8, tmpV.z + 6); moonLight.target.position.copy(tmpV);

  for (const c of clouds){ const u = c.userData; u.a += u.sp * dt; const rel = ((u.y - camY) % 30 + 45) % 30 - 15; c.position.set(Math.sin(u.a) * u.r, camY + rel, -Math.abs(Math.cos(u.a)) * u.r - 4); c.rotation.y = u.a; }
  for (let i = 0; i < flyN; i++){ const f = flySeed[i]; const a = f[0] + G.t * .08 + Math.sin(G.t * .5 + f[3]) * .2; flyPos[i * 3] = Math.sin(a) * f[1]; flyPos[i * 3 + 1] = camY + f[2] + Math.sin(G.t * .7 + f[3]) * .4; flyPos[i * 3 + 2] = Math.cos(a) * f[1]; }
  flyGeo.attributes.position.needsUpdate = true;
  flies.material.size = .3 + Math.sin(G.t * 3) * .05;
  if ((shootT -= dt) < 0){ shootT = 7 + Math.random() * 9; shootingStar(); }

  if (toastTimer > 0){ toastTimer -= dt; if (toastTimer <= 0) ui.toast.classList.remove('on'); }
  if (floorTimer > 0){ floorTimer -= dt; if (floorTimer <= 0) ui.floor.classList.remove('on'); }
  if (!ui.dbg.hidden){
    const near = hazards.filter(h => Math.abs(h.k - G.s) < 8).map(h => `${h.type}@${h.k}${h.deadly(G.s) ? ' !' : ''}`).join('  ');
    ui.dbg.textContent = `fps ${fps}  s ${G.s.toFixed(2)}  v ${G.speed.toFixed(1)}  lamp ${G.charges}\n${near}`;
  }
  renderer.render(scene, camera);
}

reset(); G.state = 'title';
requestAnimationFrame(t => { lastT = t; frame(t); });
})();
</script>
