<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1B1D52">
<meta name="description" content="Climb to the top of a tower full of danger. Controlled by scrolling.">
<meta property="og:title" content="Scroll Princess">
<meta property="og:type" content="website">
<meta property="og:description" content="Climb to the top of a tower full of danger. Controlled by scrolling.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.png" type="image/png" sizes="64x64">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Scroll Princess</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@500;700;800&family=Kurale&family=Philosopher:wght@700&display=swap">
<style>
/* Layout: full-screen night diorama; UI floats as cream paper bubbles. One deliberate night world, same in both themes. */
:root{
  --ink:#4A3F6B;          /* plum ink on cream */
  --ink-soft:#7D7299;
  --paper:#FFF8EA;        /* cream bubbles */
  --rose:#E88A7A;
  --lantern:#D9544A;      /* lantern red, the accent */
  --lantern-deep:#A83A36;
  --mint:#9ED8C4;
  --night:#1B1D52;
  --f-display:"Fredoka","Nunito",ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;
  --f-script:"Kurale","Philosopher",Georgia,"Times New Roman","Songti SC","Noto Serif CJK SC","Source Han Serif SC","Hiragino Mincho ProN","Yu Mincho","Noto Serif KR",serif;
  --f-body:"Nunito",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{margin:0;background:var(--night);color:var(--ink);font-family:var(--f-body);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#sky,#stars,#stars2,#c{position:fixed;inset:0;width:100%;height:100%}
#sky{background:linear-gradient(to top,#5B5A94,#2E3272 45%,#15174A)}
#stars,#stars2{pointer-events:none;background-repeat:repeat;mix-blend-mode:screen}
#stars2{animation:twinkle 3.2s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.15}to{opacity:.9}}
#moon{position:fixed;top:calc(env(safe-area-inset-top,0px) + 96px);right:22%;width:64px;height:64px;border-radius:50%;box-shadow:-14px 8px 0 0 #FFF4C9;transform:rotate(-12deg);filter:drop-shadow(0 0 18px rgba(255,240,190,.55));pointer-events:none}
.shoot{position:fixed;height:2px;width:120px;border-radius:2px;background:linear-gradient(90deg,rgba(255,250,225,0),#FFF6D8);transform-origin:right center;pointer-events:none;opacity:0}
.shoot.go{animation:shoot 1.1s ease-out forwards}
@keyframes shoot{0%{opacity:0;translate:0 0}15%{opacity:1}100%{opacity:0;translate:-260px 120px}}
#c{display:block;touch-action:none;outline:none}

/* HUD */
.hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 0;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:5}
.pause{pointer-events:auto;width:44px;height:44px;border-radius:50%;border:0;background:var(--paper);box-shadow:0 4px 14px rgba(10,10,40,.35);display:grid;place-items:center;cursor:pointer}
.pause:focus-visible,.btn:focus-visible{outline:3px solid var(--mint);outline-offset:3px}
.pause svg{width:16px;height:16px}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:8px;margin-right:-16px}
.ribbon{display:flex;align-items:center;gap:8px;padding:8px 18px 8px 26px;background:var(--paper);color:var(--ink);font-family:var(--f-display);font-weight:600;font-size:22px;font-variant-numeric:tabular-nums;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,13px 50%);filter:drop-shadow(0 4px 10px rgba(10,10,40,.35))}
.ribbon svg{width:22px;height:22px;flex:none}
.ribbon.bump{animation:bump .35s ease}
@keyframes bump{40%{transform:scale(1.08)}}
.charges{display:flex;gap:6px;padding-right:16px;transition:opacity .4s;opacity:0}
.charges i{width:12px;height:12px;border-radius:50%;background:#FFD27A;box-shadow:0 0 10px #FFC060;transition:background .3s,box-shadow .3s}
.charges i.off{background:rgba(255,248,234,.25);box-shadow:none}

/* Panels */
.panel{position:fixed;inset:0;display:grid;place-items:center;padding:24px 16px;z-index:10;pointer-events:none}
.card{pointer-events:auto;width:min(360px,100%);background:var(--paper);border-radius:30px;padding:26px 24px 22px;box-shadow:0 20px 60px rgba(8,8,40,.5);text-align:center;display:flex;flex-direction:column;gap:14px;animation:rise .5s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{transform:translateY(16px);opacity:0}}
.card h1,.card h2{margin:0;font-family:var(--f-display);font-weight:600;text-wrap:balance;line-height:1.05;color:var(--ink)}
.card h1{font-size:40px;letter-spacing:-.5px}
.card h2{font-size:28px}
.card p{margin:0;font-size:15px;line-height:1.45;color:var(--ink-soft)}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{font-size:12.5px;font-weight:800;letter-spacing:.3px;padding:6px 10px;border-radius:99px;background:#E4F3EC;color:var(--ink)}
.btn{font:600 19px var(--f-display);color:#fff;background:var(--lantern);border:0;border-radius:99px;padding:14px 22px;cursor:pointer;box-shadow:0 6px 0 var(--lantern-deep);transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--lantern-deep)}
.btn.go{position:relative;isolation:isolate;align-self:center;font-size:24px;letter-spacing:.3px;padding:16px 38px;background:linear-gradient(135deg,#FF7A59,#FF4F8B);box-shadow:0 7px 0 #B8335E;transition:transform .15s,box-shadow .15s,background .2s}
.btn.go::after{content:"";position:absolute;inset:-4px;border-radius:inherit;background:inherit;filter:blur(16px);opacity:.55;z-index:-1;animation:glowpulse 1.8s ease-in-out infinite}
.btn.go:hover{background:linear-gradient(135deg,#FFC23A,#FF6A3D);box-shadow:0 9px 0 #C4541F;transform:translateY(-2px) scale(1.05)}
.btn.go:active{transform:translateY(5px) scale(.98);box-shadow:0 2px 0 #B8335E}
@keyframes glowpulse{50%{opacity:.9;transform:scale(1.06)}}
.title-card{width:min(290px,100%);padding:24px 22px 26px;gap:8px;border-radius:26px}
.title-card h1{font-family:var(--f-script);font-weight:400;font-size:40px;line-height:.9;letter-spacing:.3px;padding-top:4px}
.title-card .subtitle{font:800 11.5px var(--f-body);letter-spacing:4px;text-transform:uppercase;color:var(--lantern-deep);margin-top:6px}
.title-card p{font-size:13.5px;margin-top:6px}
.title-card .btn.go{margin-top:22px}
.t-lamp{width:118px;height:auto;display:block;margin:-10px auto -14px;overflow:visible}
.t-rays{transform-origin:50px 38px;animation:rays 2.8s ease-in-out infinite}
@keyframes rays{0%,100%{opacity:.75;transform:scale(.95)}50%{opacity:1;transform:scale(1.04)}}
.toggles{display:flex;gap:12px;justify-content:center}
.tgl{width:72px;padding:12px 0;border-radius:18px;border:0;background:#EEE6F7;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:5px;font:800 12.5px var(--f-body);cursor:pointer;transition:background .15s,color .15s,transform .1s}
.tgl svg{width:30px;height:30px}
.tgl .x{display:none}
.tgl:hover{background:#E4F3EC}
.tgl:active{transform:scale(.95)}
.tgl:focus-visible{outline:3px solid var(--mint);outline-offset:2px}
.tgl[aria-pressed="false"]{background:#ECE7F0;color:#A69DB8}
.tgl[aria-pressed="false"] .x{display:inline}
.tgl[aria-pressed="false"] .w{display:none}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;padding:9px 34px !important;min-width:120px;height:56px;box-sizing:border-box}
.icon-btn svg{height:48px;width:auto;display:block}
.icon-btn .ico{height:32px;width:32px;transition:transform .35s}
.icon-btn .ico-play{height:34px;width:34px;margin-left:3px}
.icon-btn:hover .ico{transform:rotate(-120deg)}
.ico-walk .leg{transform-box:fill-box;transform-origin:50% 0}
.ico-walk .l1{animation:stepA .6s ease-in-out infinite alternate}
.ico-walk .l2{animation:stepA .6s ease-in-out infinite alternate-reverse}
.ico-walk{animation:bob .3s ease-in-out infinite alternate}
@keyframes stepA{from{transform:rotate(22deg)}to{transform:rotate(-22deg)}}
@keyframes bob{to{transform:translateY(-1.5px)}}
.mini-card{width:min(270px,100%);padding:30px 22px 34px;gap:22px;align-items:center}
.mid{height:108px;display:flex;align-items:center;justify-content:center}
.art{width:180px;height:149px;display:block;border-radius:16px;flex:none}
.art .o,.t-lamp .o{stroke:#3A2F5E;stroke-width:1.5;stroke-linejoin:round;paint-order:stroke}
.smoke{animation:smoke 2.4s ease-in-out infinite}
@keyframes smoke{0%{opacity:0;transform:translateY(6px)}40%{opacity:.9}100%{opacity:0;transform:translateY(-10px)}}
.swipe{width:112px;height:auto;display:block;margin:2px auto 26px;overflow:visible}
.btn.go.nudge{animation:nudge .6s ease}
@keyframes nudge{0%,100%{transform:none}25%{transform:scale(1.14)}50%{transform:scale(.96)}75%{transform:scale(1.06)}}
.btn.alt{background:#7D7299;box-shadow:0 6px 0 #5E5580}
.small{font-size:12.5px!important}
.big{font-family:var(--f-display);font-weight:600;font-size:64px;line-height:1;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;font-variant-numeric:tabular-nums}
.big svg{width:34px;height:34px;opacity:.85}
.best{font-weight:800;font-size:14px;letter-spacing:.4px;text-transform:uppercase;color:var(--lantern-deep)}
.newrec{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:99px;background:var(--lantern);color:#fff}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);transform:translate(-50%,20px);max-width:calc(100% - 32px);width:max-content;background:var(--paper);color:var(--ink);font-weight:800;font-size:15px;padding:12px 18px;border-radius:18px;box-shadow:0 10px 30px rgba(8,8,40,.45);opacity:0;transition:opacity .35s,transform .35s;z-index:6;text-align:center;text-wrap:balance}
.toast.on{opacity:1;transform:translate(-50%,0)}
.floor{position:fixed;left:0;right:0;top:30%;text-align:center;font-family:var(--f-display);font-weight:600;font-size:40px;color:var(--paper);text-shadow:0 3px 18px rgba(8,8,40,.6);opacity:0;transition:opacity .6s,transform .6s;transform:translateY(10px);pointer-events:none;z-index:4}
.floor.on{opacity:1;transform:none}
.floor .orn{display:inline-block;margin:0 .32em;opacity:.8;font-size:.8em;transform:translateY(-.08em)}
.floor small{display:block;font-family:var(--f-body);font-weight:800;font-size:13px;letter-spacing:2px;text-transform:uppercase;opacity:.9}
.sndpill{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 16px);z-index:6;border:0;border-radius:50%;width:52px;height:52px;display:grid;place-items:center;background:var(--paper);box-shadow:0 0 0 0 rgba(255,248,234,.7),0 6px 18px rgba(8,8,40,.4);cursor:pointer;animation:ping 1.6s ease-out infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(255,248,234,.7),0 6px 18px rgba(8,8,40,.4)}100%{box-shadow:0 0 0 16px rgba(255,248,234,0),0 6px 18px rgba(8,8,40,.4)}}
#mist{position:fixed;inset:0;pointer-events:none;z-index:3;opacity:0}
#cloud{position:fixed;inset:0;pointer-events:none;opacity:0;background:#D4D6E6}
.mult{padding:5px 12px 5px 14px;margin-right:16px;border-radius:99px;background:#F08BC8;color:#fff;font:800 14px var(--f-body);box-shadow:0 4px 14px rgba(240,139,200,.55);animation:bump 1s ease infinite}
.endp{place-items:start center;padding-top:calc(env(safe-area-inset-top,0px) + 18px)}
.end-ribbon{pointer-events:auto;display:flex;align-items:center;justify-content:center;gap:16px;padding:9px 46px;background:var(--paper);clip-path:polygon(0 0,100% 0,calc(100% - 22px) 50%,100% 100%,0 100%,22px 50%);filter:drop-shadow(0 6px 16px rgba(8,8,40,.45));animation:rise .5s cubic-bezier(.2,.8,.2,1)}
.end-ribbon .big{flex-direction:row;font-size:36px;gap:8px}
.end-ribbon .big svg{width:26px;height:26px}
.end-ribbon .icon-btn{min-width:0;width:48px;height:48px;padding:0!important;border-radius:50%;box-shadow:0 4px 0 #B8335E}
.end-ribbon .icon-btn .ico{width:24px;height:24px}
.end-ribbon .btn.go::after{inset:-2px;filter:blur(10px)}
.dbg{position:fixed;left:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);font:12px/1.4 ui-monospace,Menlo,monospace;color:var(--ink);background:var(--paper);padding:6px 8px;border-radius:8px;z-index:7;white-space:pre}
.hint-arrow{display:inline-block;animation:nudge 1.4s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(-5px)}}
@media (prefers-reduced-motion:reduce){.card,.hint-arrow,.ribbon.bump,#stars2,.btn.go::after,.ico-walk,.ico-walk .leg,.smoke,.sndpill,.t-rays{animation:none}}
</style>
</head>
<body>


<div id="sky"></div>
<div id="stars"></div>
<div id="stars2"></div>
<div id="moon"></div>
<div class="shoot" id="shoot"></div>
<div id="cloud"></div>
<canvas id="c" tabindex="0" aria-label="Игровое поле: башня со спиральной лестницей"></canvas>

<div class="hud" id="hud" hidden>
  <button class="pause" id="pauseBtn" aria-label="Пауза">
    <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="2" width="3.6" height="12" rx="1.6" fill="#4A3F6B"/><rect x="9.4" y="2" width="3.6" height="12" rx="1.6" fill="#4A3F6B"/></svg>
  </button>
  <div class="right">
    <div class="ribbon" id="ribbon"><span id="score">0</span>
      <svg viewBox="0 0 24 24" aria-label="шагов"><g fill="#4A3F6B"><ellipse cx="7.5" cy="8" rx="3" ry="4.6"/><ellipse cx="7.5" cy="16.2" rx="2.2" ry="1.9"/><ellipse cx="16.5" cy="6" rx="3" ry="4.6"/><ellipse cx="16.5" cy="14.2" rx="2.2" ry="1.9"/></g></svg>
    </div>
    <div class="charges" id="charges" aria-label="Заряд лампы"><i></i><i></i><i></i></div>
    <div class="mult" id="multBadge" hidden>×2</div>
  </div>
</div>

<div class="panel" id="titleP">
  <div class="card title-card">
    <svg class="t-lamp" viewBox="0 -6 100 88" aria-hidden="true"><defs><radialGradient id="lgT"><stop offset="0" stop-color="#FFD98A" stop-opacity=".8"/><stop offset="1" stop-color="#FFD98A" stop-opacity="0"/></radialGradient></defs><circle cx="50" cy="38" r="30" fill="url(#lgT)"/><g class="t-rays"><g stroke="#F2B84B" stroke-width="3" stroke-linecap="round"><line x1="50.0" y1="10.0" x2="50.0" y2="-3.0"/><line x1="64.0" y1="13.8" x2="68.0" y2="6.8"/><line x1="74.2" y1="24.0" x2="85.5" y2="17.5"/><line x1="78.0" y1="38.0" x2="86.0" y2="38.0"/><line x1="74.2" y1="52.0" x2="85.5" y2="58.5"/><line x1="64.0" y1="62.2" x2="68.0" y2="69.2"/><line x1="50.0" y1="66.0" x2="50.0" y2="79.0"/><line x1="36.0" y1="62.2" x2="32.0" y2="69.2"/><line x1="25.8" y1="52.0" x2="14.5" y2="58.5"/><line x1="22.0" y1="38.0" x2="14.0" y2="38.0"/><line x1="25.8" y1="24.0" x2="14.5" y2="17.5"/><line x1="36.0" y1="13.8" x2="32.0" y2="6.8"/></g></g><g transform="translate(50 38) scale(1.2) translate(-50 -39)"><path d="M43 20a7 7 0 0 1 14 0" stroke="#5A4B4B" stroke-width="3" fill="none" stroke-linecap="round"/>
<path class="o" d="M39 28h22l-4-7.5H43Z" fill="#D9544A"/>
<rect class="o" x="41" y="28" width="18" height="19" rx="2.6" fill="#FFE9B0"/>
<rect x="44" y="31" width="12" height="13" rx="1.8" fill="#FFF7DA"/>
<rect x="48.8" y="28" width="2.4" height="19" fill="#D9544A" opacity=".5"/>
<rect class="o" x="38" y="47" width="24" height="6" rx="2.2" fill="#D9544A"/>
<rect class="o" x="38" y="51.2" width="24" height="1.8" rx=".9" fill="#A83C38"/></g></svg>
    <h1 id="gameTitle">Принцесса Скролл</h1>
    <div class="subtitle" id="gameSub">восхождение</div>
    <button class="btn go icon-btn" id="startBtn" aria-label="Начать"><svg class="ico-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.2v13.6L19.2 12Z" fill="#fff" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"/></svg></button>
    <p class="small" id="bestTitle" hidden></p>
  </div>
</div>

<div class="panel" id="overP" hidden>
  <div class="card mini-card">
    <svg class="art" viewBox="0 0 150 124" aria-hidden="true">
      <rect width="150" height="124" rx="16" fill="#2E3272"/><g transform="translate(15 0)"><g fill="#FFF6D8"><circle class="o" cx="14" cy="17" r="1.1"/><circle class="o" cx="36" cy="10" r=".9"/><circle class="o" cx="103" cy="50" r="1"/><circle class="o" cx="22" cy="57" r=".8"/><circle class="o" cx="84" cy="12" r=".8"/></g><circle cx="101" cy="20" r="7" fill="#FFF4C9"/><circle cx="104" cy="17.6" r="6.2" fill="#2E3272"/>
      <path class="smoke" d="M60 58c-5-6 5-9 0-15s5-9 0-15" stroke="#B9B3CC" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path class="o" d="M52 50h16l10 42H42Z" fill="#F8F5F1"/><rect class="o" x="42" y="89" width="36" height="4" rx="2" fill="#E2BE68"/>
      <rect class="o" x="49" y="92" width="6" height="14" rx="2.5" fill="#F6D2BC"/><rect class="o" x="65" y="92" width="6" height="14" rx="2.5" fill="#F6D2BC"/>
      <ellipse class="o" cx="52" cy="107" rx="5" ry="3.2" fill="#fff"/><ellipse class="o" cx="68" cy="107" rx="5" ry="3.2" fill="#fff"/>
      <path d="M52 56 58 70M68 56 62 70" stroke="#3A2F5E" stroke-width="8.3" stroke-linecap="round"/><path d="M52 56 58 70M68 56 62 70" stroke="#F8F5F1" stroke-width="5.5" stroke-linecap="round"/>
      <rect class="o" x="53" y="73" width="14" height="6" rx="1.5" fill="#9E4A48"/><rect class="o" x="54.5" y="62" width="11" height="11" rx="1.5" fill="#3A3D66"/><path class="o" d="M53 62h14l-2.5-4.5h-9Z" fill="#9E4A48"/><path d="M56 57.5a4 4 0 0 1 8 0" stroke="#5A4B4B" stroke-width="1.6" fill="none"/>
      <circle class="o" cx="60" cy="41" r="11" fill="#F6D2BC"/>
      <rect class="o" x="46.5" y="34" width="5.5" height="17" rx="1.5" fill="#F0D28A"/><rect class="o" x="68" y="34" width="5.5" height="17" rx="1.5" fill="#F0D28A"/>
      <path d="M54.5 42.5q1.5 1.6 3 0M62.5 42.5q1.5 1.6 3 0" stroke="#2A2230" stroke-width="1.7" fill="none" stroke-linecap="round"/>
      <path class="o" d="M60 3 71.5 32h-23Z" fill="#F8F5F1"/><rect class="o" x="47" y="30" width="26" height="4.5" rx="2.2" fill="#E2BE68"/></g>
    </svg>
    <div class="big mid">
      <svg viewBox="0 0 24 24" aria-hidden="true"><g fill="#4A3F6B"><ellipse cx="7.5" cy="8" rx="3" ry="4.6"/><ellipse cx="7.5" cy="16.2" rx="2.2" ry="1.9"/><ellipse cx="16.5" cy="6" rx="3" ry="4.6"/><ellipse cx="16.5" cy="14.2" rx="2.2" ry="1.9"/></g></svg>
      <span id="overScore">0</span>
    </div>
    <div class="best" id="overBest" hidden></div>
    <p id="overWhy" hidden></p>
    <button class="btn go icon-btn" id="againBtn" aria-label="Ещё раз"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.4 12.6a7.4 7.4 0 1 1-2.3-6" stroke="#fff" stroke-width="2.7" fill="none" stroke-linecap="round"/><path d="M19.6 3.4v4.8h-4.8" stroke="#fff" stroke-width="2.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
</div>

<div class="panel endp" id="endP" hidden>
  <div class="end-ribbon">
    <div class="big">
      <svg viewBox="0 0 24 24" aria-hidden="true"><g fill="#4A3F6B"><ellipse cx="7.5" cy="8" rx="3" ry="4.6"/><ellipse cx="7.5" cy="16.2" rx="2.2" ry="1.9"/><ellipse cx="16.5" cy="6" rx="3" ry="4.6"/><ellipse cx="16.5" cy="14.2" rx="2.2" ry="1.9"/></g></svg>

const winFrameM = new T.MeshStandardMaterial({ color: 0xEADCC6, roughness: .8 });
function archShape(w, h, pad){ // arched outline: rectangle of height h with a semicircle on top, grown by pad

// Soft glow textures: keep RGB constant and only the alpha soft. A canvas stores premultiplied pixels, so nearly transparent
// texels lose their colour and come back as coloured noise on phones; building the texels directly avoids it.
function softTex(c, r, g, b){
  const w = c.width, h = c.height, src = c.getContext('2d').getImageData(0, 0, w, h).data, out = new Uint8Array(w * h * 4);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++){ const i = (y * w + x) * 4, o = ((h - 1 - y) * w + x) * 4; out[o] = r; out[o + 1] = g; out[o + 2] = b; out[o + 3] = src[i + 3]; }
  const t = new T.DataTexture(out, w, h, T.RGBAFormat); t.minFilter = T.LinearMipmapLinearFilter; t.magFilter = T.LinearFilter; t.generateMipmaps = true; t.needsUpdate = true; return t;
}

  const g = new T.Group(), inner = new T.Group(); g.add(inner);
  const body = mesh(sphere(.16, 12, 9), M(PAL.raven), 0, 0, 0, inner); body.scale.set(.85, .8, 1.35);
  const head = new T.Group(); head.position.set(0, .13, .17); inner.add(head);
  mesh(sphere(.1, 12, 9), M(PAL.raven), 0, 0, 0, head);
  const beak = mesh(new T.ConeGeometry(.035, .12, 8), M(PAL.beak), 0, -.01, .12, head); beak.rotation.x = Math.PI / 2;
  [-1, 1].forEach(sd => mesh(sphere(.02, 6, 5), B(PAL.eye), sd * .055, .03, .06, head));
  const tail = mesh(new T.BoxGeometry(.13, .03, .2), M(PAL.raven2), 0, .02, -.27, inner); tail.rotation.x = -.3;
  const wings = [-1, 1].map(sd => {
    const piv = new T.Group(); piv.position.set(sd * .1, .05, 0); inner.add(piv);
    const wm = mesh(sphere(.15, 10, 6), M(PAL.raven2), sd * .15, 0, 0, piv); wm.scale.set(1.1, .15, .7);
    const tp = mesh(sphere(.07, 8, 5), M(PAL.ravenTip), sd * .31, 0, -.02, piv); tp.scale.set(1, .2, .9);

  [-1, 1].forEach(sd => mesh(new T.CylinderGeometry(.01, .01, .12, 4), M(PAL.beak), sd * .05, -.15, 0, inner));

}
function flap(r, t, speed = 18, amp = .8, fold = 0){ r.wings.forEach((w, i) => { const sd = i ? 1 : -1; w.rotation.z = sd * (fold ? -1.2 : Math.sin(t * speed) * amp); }); }

/* ---- 1. Skeleton ---- */
function Skeleton(k, first){
  const C = CFG.HAZ.skeleton; const rnd = mulberry32(k * 7 + 1);
  const root = new T.Group(); place(root, k, CFG.RMID + .05); tower.add(root);
  const tmp = new T.Group(); tmp.rotation.y = -Math.PI / 2 + .55; root.add(tmp);
  const pieces = []; const bm = M(PAL.bone, { roughness: .7 }), bs = M(PAL.boneShade, { roughness: .7 });
  const add = (geo, m, x, y, z, rz = 0) => { const me = mesh(geo, m, x, y, z, tmp); me.rotation.z = rz; me.castShadow = true; pieces.push(me); return me; };
  const skull = add(sphere(.15, 14, 12), bm, 0, 1.08, 0); skull.scale.set(1, .95, 1.05);
  [-1, 1].forEach(sd => { mesh(sphere(.042, 8, 6), M(0x3A3358), sd * .055, .01, .12, skull); mesh(sphere(.017, 6, 5), B(PAL.eye), sd * .055, .012, .158, skull); });
  add(new T.BoxGeometry(.16, .05, .12), bs, 0, .94, .03);
  add(new T.CylinderGeometry(.025, .025, .42, 6), bs, 0, .68, -.02);
  for (let i = 0; i < 3; i++){ const rib = add(new T.TorusGeometry(.12 - i * .014, .018, 5, 12, Math.PI * 1.4), bm, 0, .84 - i * .075, 0); rib.rotation.x = Math.PI / 2; }
  add(new T.BoxGeometry(.22, .08, .11), bm, 0, .45, 0);
  [-1, 1].forEach(sd => { add(new T.CylinderGeometry(.03, .025, .42, 6), bm, sd * .07, .22, 0); add(new T.CylinderGeometry(.025, .02, .42, 6), bm, sd * .17, .67, 0, sd * .15); add(new T.BoxGeometry(.07, .04, .12), bs, sd * .07, .02, .03); });
  root.updateMatrixWorld(true); pieces.forEach(p => root.attach(p)); root.remove(tmp);
  const data = pieces.map(p => {
    const x = (rnd() - .5) * 1.4, z = (rnd() - .5) * .9;
    const e = new T.Euler((rnd() < .6 ? Math.PI / 2 : 0) + (rnd() - .5) * .4, rnd() * 6.28, rnd() < .6 ? Math.PI / 2 : 0);
    return { m: p, A: { p: p.position.clone(), q: p.quaternion.clone() }, B: { p: new T.Vector3(x, Math.round(x / L) * CFG.H + .045, z), q: new T.Quaternion().setFromEuler(e) }, d: rnd() * .12 };
  });
  data[0].B.p.set(-L * .9, -CFG.H + .14, .2);
  const off = rnd() * 5; let last = '', danger = true;
  return {
    type: 'skeleton', k, len: 1, first,
    update(c){
      const sc = 1 - .22 * c.diff, st = C.stand * sc, pi = C.pile * sc;
      const Pd = st + C.crumble + pi + C.tremble + C.assemble; let tt = ((c.t + off) % Pd + Pd) % Pd;
      let f = 0, trem = 0, state, loc = 0;
      if (tt < st) state = 'stand';
      else if ((tt -= st) < C.crumble){ state = 'crumble'; f = tt / C.crumble; }
      else if ((tt -= C.crumble) < pi){ state = 'pile'; f = 1; }
      else if ((tt -= pi) < C.tremble){ state = 'tremble'; f = 1; trem = tt / C.tremble; }
      else { tt -= C.tremble; loc = tt / C.assemble; state = 'assemble'; f = 1 - loc; }
      danger = state === 'stand' || (state === 'crumble' && f < .3) || (state === 'assemble' && loc > .55);
      if (state !== last && Math.abs(c.s - k) < 9){
        if (state === 'crumble') AU.rattle(clamp(1.2 - Math.abs(c.s - k) / 8, .2, 1));
        if (state === 'tremble') AU.rattle(.35);
        if (state === 'assemble') AU.rattle(.6);
      }
      last = state;
      const up = state === 'assemble';
      for (const d of data){
        const fi = clamp(f * 1.14 - d.d, 0, 1), e = up ? ease(fi) : easeOut(fi);
        d.m.position.lerpVectors(d.A.p, d.B.p, e);
        d.m.position.y += Math.sin(fi * Math.PI) * (up ? .45 : .28);
        d.m.quaternion.copy(d.A.q).slerp(d.B.q, e);
        if (trem){ const j = .025 * trem; d.m.position.x += (Math.random() - .5) * j; d.m.position.y += Math.random() * j; }
      }
      if (state === 'stand') data[0].m.position.y += Math.sin(c.t * 2.6 + off) * .012;
    },
    deadly(s){ return danger && Math.abs(s - k) < .55; },
    dispose(){ tower.remove(root); }
  };
}

/* ---- 2. Raven on the rail: attacks anyone who runs past, only a calm walk is safe ---- */
function RavenPerch(k, first){
  const C = CFG.HAZ.raven;
  const root = new T.Group(); place(root, k, CFG.ROUT - .12, .5 + .12); tower.add(root);
  const r = buildRaven(.8); r.g.rotation.y = -Math.PI / 4; root.add(r.g);
  const bang = bangSprite(); bang.position.set(0, .45, 0); root.add(bang);
  let state = 'perch', tm = 0, warn = 0, bodyYaw = -Math.PI / 4, foe = null; const prev = new T.Vector3(), tgt = new T.Vector3(), rel = new T.Vector3();
  const angDiff = (a, b) => Math.atan2(Math.sin(a - b), Math.cos(a - b));
  return {
    type: 'raven', k, len: 1, first,
    hitBoss(b){ if (state === 'perch'){ state = 'boss'; tm = 0; foe = b; bang.visible = false; AU.caw(1); tower.attach(r.g); prev.copy(r.g.position); } else b.hurt(); },
    update(c){
      const thr = lerp(C.thr, C.thrMin, c.diff);
      const d = k - c.s, near = d > -3 && d < C.see;
      tm += c.dt;
      if (state === 'perch'){
        // warning phase: running nearby raises a "!"; slow to a walk before it fills up and the raven settles down
        // once she has walked past, the raven relaxes: a brisker pace is fine, only a real sprint right behind it counts
        const behind = d < 0, thrHere = behind ? thr * lerp(1.5, 1.8, clamp(-d / 3, 0, 1)) : thr;
        const fast = near && c.speed > thrHere && G.state === 'play';
        if (fast){ if (warn === 0){ AU.caw(.45); ravenToast(); } warn += c.dt; }
        else warn = Math.max(0, warn - c.dt * 1.6);
        const lim = lerp(C.warn, C.warnMin, c.diff), f = clamp(warn / lim, 0, 1);
        // gaze: while the princess is near, the raven turns its body toward her and its head follows her exactly
        const watching = d > -3 && d < C.see && G.state === 'play';
        const ease = 1 - Math.exp(-c.dt * (watching ? 5 : 2));
        if (watching){
          girlCenterAt(c.s); rel.copy(girlCenter).sub(root.position).applyAxisAngle(UP, -root.rotation.y);
          const want = Math.atan2(rel.x, rel.z);
          bodyYaw += angDiff(want, bodyYaw) * .7 * ease;
          const headYaw = clamp(angDiff(want, bodyYaw), -1.1, 1.1);
          const pitch = clamp(Math.atan2(-(rel.y - .15), Math.hypot(rel.x, rel.z)), -.6, .5);
          r.head.rotation.y += (headYaw - r.head.rotation.y) * Math.min(1, c.dt * 10);
          r.head.rotation.x += (pitch - r.head.rotation.x) * Math.min(1, c.dt * 8);
          const close = Math.abs(d) < 2 && warn === 0;
          r.head.rotation.z += ((close ? Math.sin(c.t * 1.4 + k) * .3 : 0) - r.head.rotation.z) * Math.min(1, c.dt * 4);
        } else {
          bodyYaw += angDiff(-Math.PI / 4, bodyYaw) * ease;
          r.head.rotation.y += (Math.sin(c.t * .7 + k) * .4 - r.head.rotation.y) * Math.min(1, c.dt * 3);
          r.head.rotation.x *= 1 - Math.min(1, c.dt * 3); r.head.rotation.z *= 1 - Math.min(1, c.dt * 3);
        }
        r.g.rotation.y = bodyYaw;
        r.inner.position.y = warn > 0 ? -.05 * f + Math.abs(Math.sin(c.t * 30)) * .02 * f : 0;
        if (warn > 0) r.wings.forEach((w, i) => w.rotation.z = (i ? 1 : -1) * (-1.2 + .7 * f + Math.sin(c.t * 28) * .12 * f)); else flap(r, c.t, 0, 0, 1);
        bang.visible = warn > 0;
        if (bang.visible){ bang.scale.setScalar(.42 + .22 * f + Math.sin(c.t * 14) * .05); bang.material.color.setRGB(1, 1 - .45 * f, 1 - .45 * f); }
        // running right past the raven (or away from it with the warning still up) always provokes the attack
        const runningPast = G.state === 'play' && ((d > -.3 && d < .4 && c.speed > thr * 1.35) || (behind && d > -1.5 && c.speed > thr * 2));
        if (warn >= lim || runningPast){ state = 'swoop'; tm = 0; bang.visible = false; AU.caw(1); tower.attach(r.g); prev.copy(r.g.position); }
      } else if (state === 'swoop'){
        // homes in on the princess; once it has launched it will not miss
        girlCenterAt(c.s); tgt.copy(girlCenter);
        const pos = r.g.position; const dir = tgt.clone().sub(pos); const dl = dir.length();
        if (dl > 1e-4) pos.addScaledVector(dir, Math.min(1, C.swoopSpeed * c.dt / dl));
        pos.y += Math.sin(tm * 18) * .01;
        const mv = pos.clone().sub(prev); if (mv.lengthSq() > 1e-7) r.g.lookAt(tower.localToWorld(pos.clone().add(mv)));
        prev.copy(pos); flap(r, c.t, 24, .95);
        if (G.state !== 'play' && tm > .6){ state = 'leave'; tm = 0; }
      } else if (state === 'boss'){
        tgt.copy(foe.head()); tgt.y -= .1;
        const pos = r.g.position; const dir = tgt.clone().sub(pos); const dl = dir.length();
        if (dl > 1e-4) pos.addScaledVector(dir, Math.min(1, C.swoopSpeed * .8 * c.dt / dl));
        const mv = pos.clone().sub(prev); if (mv.lengthSq() > 1e-7) r.g.lookAt(tower.localToWorld(pos.clone().add(mv)));
        prev.copy(pos); flap(r, c.t, 24, .95);
        if (dl < .35 || tm > 2.5){ foe.hurt(); foe = null; state = 'leave'; tm = 0; }
      } else if (state === 'leave'){
        r.g.position.add(new T.Vector3(0, 2.2 * c.dt, 0)).addScaledVector(r.g.position.clone().setY(0).normalize(), 2.5 * c.dt);
        flap(r, c.t, 16, .8); if (tm > 2.5) r.g.visible = false;
      }
    },
    deadly(s){ if (state !== 'swoop') return false; girlCenterAt(s); return r.g.position.distanceTo(girlCenter) < .5; },
    dispose(){ tower.remove(root); if (r.g.parent) r.g.parent.remove(r.g); }
  };
}

/* ---- 3. Flock crossing ---- */
const birdShadowGeo = (() => {
  const sh = new T.Shape(); // top-down silhouette of a bird with spread wings, beak pointing +y
  const pts = [[0, .16], [.05, .06], [.16, .09], [.3, .06], [.4, .0], [.24, -.01], [.1, -.04], [.06, -.1], [.1, -.17], [0, -.13]];
  sh.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) sh.lineTo(pts[i][0], pts[i][1]);
  for (let i = pts.length - 2; i > 0; i--) sh.lineTo(-pts[i][0], pts[i][1]);
  sh.closePath();
  return new T.ShapeGeometry(sh);
})();
function Flock(k, first){
  const C = CFG.HAZ.flock; const rnd = mulberry32(k * 13 + 5);
  const g = new T.Group(); tower.add(g);
  const birds = []; for (let i = 0; i < 7; i++){ const r = buildRaven(.85); r.g.visible = false; g.add(r.g); birds.push({ r, s: k - .2 + i * .42 + (rnd() - .5) * .2, dt: (rnd() - .5) * .16, rr: (rnd() - .5) * .5 }); }
  // bird-shaped shadows that sweep across the steps while the flock circles overhead
  const shM = new T.MeshBasicMaterial({ color: 0x1A1640, transparent: true, opacity: 0, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -2 });
  const shadows = birds.map(b => {
    const holder = new T.Group(); const yoff = Math.round(b.s) * CFG.H - b.s * CFG.H + .012;
    place(holder, b.s, CFG.RMID, yoff); g.add(holder);
    const m = new T.Mesh(birdShadowGeo, shM); m.rotation.x = -Math.PI / 2; holder.add(m);
    return { holder, m, yoff };
  });
  let off = rnd() * 5, danger = false, lastPh = '', foe = null;
  return {
    type: 'flock', k, len: 3, first,
    hitBoss(b){ const Pd = C.period * (1 - .2 * clamp(G.s / 900, 0, 1)), q = Pd - C.tele - C.pass; off = ((q + .01 - G.t) % Pd + Pd) % Pd; foe = b; },
    update(c){
      const Pd = C.period * (1 - .2 * c.diff); const tt = ((c.t + off) % Pd + Pd) % Pd; const q = Pd - C.tele - C.pass;
      let ph = 'quiet', u = 0;
      if (tt >= q && tt < q + C.tele){ ph = 'tele'; u = (tt - q) / C.tele; }
      else if (tt >= q + C.tele){ ph = 'pass'; u = (tt - q - C.tele) / C.pass; }
      if (ph !== lastPh && ph === 'tele' && Math.abs(c.s - k) < 9) AU.wings(clamp(1.3 - Math.abs(c.s - k) / 8, .2, 1));
      lastPh = ph;
      shM.opacity = ph === 'tele' ? .18 + .42 * u : ph === 'pass' ? .6 * (1 - clamp((u - .5) * 2, 0, 1)) : 0;
      shadows.forEach((sh, i) => {
        const b = birds[i]; let r;
        if (ph === 'tele') r = lerp(CFG.ROUT - .12, CFG.RIN + .22, ((u * 1.6 + i * .137) % 1));
        else if (ph === 'pass'){ const uu = clamp(u + b.dt, 0, 1); r = lerp(9.5, CFG.RMID + b.rr, Math.sin(uu * Math.PI)); }
        else r = 99;
        sh.holder.visible = shM.opacity > .01 && r < CFG.ROUT - .05 && r > CFG.RIN + .1;
        if (sh.holder.visible){
          sh.holder.position.copy(P(b.s, r, sh.yoff));
          const sc = ph === 'tele' ? 1.0 + .45 * u : 1.45;
          sh.m.scale.set(sc * (1 + Math.sin(c.t * 16 + i * 1.7) * .3), sc, 1);
        }
      });
      danger = ph === 'pass' && u > .32 && u < .68;
      if (foe && danger){ foe.hurt(); foe = null; }
      for (const b of birds){
        if (ph !== 'pass'){ b.r.g.visible = false; continue; }
        const uu = clamp(u + b.dt, 0, 1); b.r.g.visible = uu > 0 && uu < 1;
        const rad = v => lerp(9.5, CFG.RMID + b.rr, Math.sin(v * Math.PI));
        const pos = P(b.s, rad(uu), .95 + (.5 - uu) * 7); const nxt = P(b.s, rad(Math.min(1, uu + .02)), .95 + (.5 - uu - .02) * 7);
        b.r.g.position.copy(pos); b.r.g.lookAt(tower.localToWorld(nxt)); flap(b.r, c.t + b.s, 20, .8);
      }
    },
    deadly(s){ return danger && s > k - .55 && s < k + 2.55; },
    dispose(){ tower.remove(g); }
  };
}

/* ---- 4. Crumbling steps ---- */
function Crumble(k, first){
  const C = CFG.HAZ.crumble; const n = 4; const rnd = mulberry32(k * 17 + 3);
  const items = [];
  for (let j = k; j < k + n; j++){
    skipSteps.add(j);
    const g = new T.Group(); place(g, j, CFG.RMID); tower.add(g);
    const inner = new T.Group(); g.add(inner);
    stepBody(inner, j, 0, W, PAL.cliffCracked, PAL.grassDry);
    g.updateMatrix(); const beam = makeStringer(j); tower.remove(beam); beam.applyMatrix4(g.matrix.clone().invert()); inner.add(beam); // its piece of the side beam falls too, leaving a real hole
    for (let q = 0; q < 3; q++){ const cr = mesh(new T.BoxGeometry(.28 + rnd() * .3, .012, .03), M(PAL.crack), (rnd() - .5) * .5, .01, (rnd() - .5) * 1.2, inner); cr.rotation.y = (rnd() - .5) * 2; }
    const post = mesh(postGeo, M(PAL.woodDark), 0, .23, W / 2 - .12, inner); post.rotation.z = .12; // falls together with the step
    const chunks = []; for (let q = 0; q < 5; q++){ const ch = mesh(new T.DodecahedronGeometry(.13 + rnd() * .06, 0), M(PAL.cliffCracked, { flatShading: true }), 0, 0, 0, g); ch.visible = false; chunks.push({ m: ch, v: new T.Vector3() }); }
    items.push({ j, g, inner, chunks, state: 'ok', t: 0 });
  }
  return {
    type: 'crumble', k, len: n, first,
    get broken(){ return items.some(it => it.state !== 'ok'); },
    update(c){
      const cur = Math.round(c.s);
      for (const it of items){
        it.t += c.dt;
        if (it.state === 'ok'){ it.inner.position.set(0, 0, 0); if (cur === it.j && G.state === 'play'){ it.state = 'shake'; it.t = 0; AU.crack(); } }
        else if (it.state === 'shake'){
          const a = .012 + it.t * .03; it.inner.position.set((Math.random() - .5) * a, (Math.random() - .5) * a * .6 - it.t * .03, (Math.random() - .5) * a);
          if (it.t > C.shake * (1 - .15 * c.diff)){ it.state = 'gone'; it.t = 0; it.inner.visible = false; AU.crumble(clamp(1.2 - Math.abs(c.s - it.j) / 6, .2, 1));
            it.chunks.forEach((ch, q) => { ch.m.visible = true; ch.m.position.set((q - 2) * .15, -.2, (Math.random() - .5) * 1.2); ch.v.set((Math.random() - .5) * .8, Math.random() * .8, (Math.random() - .5) * .6); }); }
        } else if (it.state === 'gone'){
          it.chunks.forEach(ch => { ch.v.y -= 9.8 * c.dt; ch.m.position.addScaledVector(ch.v, c.dt); ch.m.rotation.x += c.dt * 3; ch.m.rotation.z += c.dt * 2; if (it.t > 1.6) ch.m.visible = false; });
        } else if (it.state === 'restore'){
          const u = clamp(it.t / C.restore, 0, 1); it.inner.scale.set(1, Math.max(.02, easeOut(u) * (1 + Math.sin(u * Math.PI) * .15)), 1); it.inner.position.set(0, (1 - u) * -.3, 0);
          if (u >= 1){ it.state = 'ok'; it.t = 0; it.inner.scale.set(1, 1, 1); }
        }
      }
    },
    deadly(s){ const cur = Math.round(s); const it = items.find(i => i.j === cur); return !!it && it.state === 'gone'; }, // once broken, a step stays broken
    dispose(){ items.forEach(it => { tower.remove(it.g); skipSteps.delete(it.j); }); }
  };
}

const mothShadowM = new T.MeshBasicMaterial({ color: 0x14113A, transparent: true, opacity: .5, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -3 });
// Shadow of a moth thrown by the lantern onto the tower wall (cylinder r = RIN): cast a ray lamp -> moth -> wall.
const _wallP = new T.Vector3(), _wallN = new T.Vector3(), _wallT = new T.Vector3();
function castOnWall(q, lamp, flapF){
  const R = CFG.RIN + .06, M0 = q.m.position;
  const dx = M0.x - lamp.x, dy = M0.y - lamp.y, dz = M0.z - lamp.z;
  const a = dx * dx + dz * dz, b = 2 * (lamp.x * dx + lamp.z * dz), cc = lamp.x * lamp.x + lamp.z * lamp.z - R * R;
  const disc = b * b - 4 * a * cc; let t = -1;
  if (a > 1e-6 && disc >= 0){ const sq = Math.sqrt(disc); const t1 = (-b - sq) / (2 * a), t2 = (-b + sq) / (2 * a); t = t1 > 1 ? t1 : (t2 > 1 ? t2 : -1); }
  const lampDist = Math.sqrt(dx * dx + dy * dy + dz * dz);

}
function start(){
  AU.unlock(); AU.start();
  if (G.state !== 'title') reset();
  AU.wake();
  G.state = 'play'; G.pending = 0;
  ui.titleP.hidden = true; ui.overP.hidden = true; ui.pauseP.hidden = true; ui.endP.hidden = true; ui.hud.hidden = false;
  try { canvas.focus({ preventScroll: true }); } catch(e){}
}
function die(cause){
  if (G.state !== 'play') return;
  G.state = 'dead'; G.cause = cause; G.deadT = 0; G.pending = 0; G.restartAcc = 0;
  const sc = Math.floor(G.maxS);
  if (sc > G.best){ G.best = sc; G.newRec = true; store.set('lg_best', sc); }
  AU.death();
}
function showOver(){
  ui.overScore.textContent = Math.floor(G.maxS);
  ui.overBest.innerHTML = G.newRec ? `Новый рекорд<span class="newrec">★</span>` : `Рекорд: ${G.best}`;
  ui.overWhy.textContent = WHY[G.cause] || '';
  ui.overP.hidden = false; ui.hud.hidden = true;
}
function drinkPotion(){
  G.mult = 2; ui.multBadge.hidden = false;
  toast('Зелье скорости! Всё вдвое быстрее до 8 этажа', 3);
  AU.tone(784, 'triangle', .5, .06); AU.tone(1175, 'triangle', .6, .05, .1); AU.tone(1568, 'sine', .7, .04, .2);
}
function startEnding(){
  G.state = 'ending'; G.endT = 0; G.pending = 0; G.speed = 0; G.mult = 1; ui.multBadge.hidden = true;
  G.s = ROOF_S - .4; G.maxS = ROOF_S; ui.score.textContent = String(ROOF_S);
  if (ROOF_S > G.best){ G.best = ROOF_S; store.set('lg_best', ROOF_S); }
  G.endFrom = P(G.s, CFG.RGIRL); const a = ROOF_S * DA + .15;
  G.endTo = new T.Vector3(Math.sin(a) * 1.05, ROOF_Y, Math.cos(a) * 1.05); G.endLit = false; G.spin = 0;
}
function updateEnding(dt){
  G.endT += dt; const t = G.endT;
  const u = ease(clamp(t / 2.2, 0, 1));
  const pos = new T.Vector3().lerpVectors(G.endFrom, G.endTo, u); pos.y = lerp(G.endFrom.y, ROOF_Y, clamp(t / .5, 0, 1));
  girl.root.position.copy(pos); girl.root.rotation.y = Math.atan2(-pos.x, -pos.z);
  const walking = t < 2.2; G.speed = walking ? 2 : 0;
  const ph = t * 5.5;
  girl.legs[0].rotation.x = walking ? Math.sin(ph) * .55 : 0; girl.legs[1].rotation.x = walking ? -Math.sin(ph) * .55 : 0;
  girl.body.position.y = walking ? Math.abs(Math.sin(ph)) * .03 : 0;
  if (t > 2.4 && t < 3.2) girl.lamp.rotation.x = -Math.sin((t - 2.4) / .8 * Math.PI) * .7;   // she raises the lantern to the coals
  if (t > 2.8 && !G.endLit){ G.endLit = true; AU.chime(); AU.musicBox(); AU.newProg(); }
  if (G.endLit){
    const f = ease(clamp((t - 2.8) / 1.4, 0, 1));
    flame.scale.set(f * (1 + Math.sin(t * 9) * .06), f * (1 + Math.sin(t * 7.3) * .1), f * (1 + Math.cos(t * 8.1) * .06));
    flame.rotation.y += dt * 1.5;
    fireLight.intensity = 3.2 * f; flameHalo.material.opacity = .85 * f;
    // the lighthouse turns only while the player scrolls, as if she were cranking it
    beam.rotation.y += G.spin * dt; G.spin *= Math.exp(-dt * 1.6);
    // each quarter turn of the light gives a soft airy whoosh with a low hum, louder the faster it spins
    G.spinAcc = (G.spinAcc || 0) + Math.abs(G.spin * dt);
    if (G.spinAcc > Math.PI / 2){ G.spinAcc = 0; const v = clamp(Math.abs(G.spin) / 5, .15, 1);
      AU.noise(.45, .05 * v, 'bandpass', 420 + v * 500, 1.2, 0, .12); AU.tone(98 + v * 30, 'sine', .5, .035 * v, 0, 92 + v * 20); }
    beamM.opacity = ease(clamp((t - 4) / 2, 0, 1)) * (.13 + Math.min(.1, Math.abs(G.spin) * .025));
  }
  if (t > 6.5 && ui.endP.hidden){ ui.endP.hidden = false; ui.hud.hidden = true; }
}
function pause(on){
  if (on && G.state === 'play'){ G.state = 'paused'; ui.pauseP.hidden = false; AU.duck(true); }
  else if (!on && G.state === 'paused'){ G.state = 'play'; ui.pauseP.hidden = true; G.pending = 0; AU.init(); AU.wake(); AU.duck(false); }
}

/* ============================== INPUT ============================== */
let nudgeAt = 0;
function nudgeStart(){
  const now = performance.now(); if (now - nudgeAt < 700) return; nudgeAt = now;
  const b = $('startBtn'); b.classList.remove('nudge'); void b.offsetWidth; b.classList.add('nudge');
}
function feed(steps){
  if (G.state === 'play') G.pending = clamp(G.pending + steps * G.mult, -CFG.pendingCap * G.mult, CFG.pendingCap * G.mult);
  else if (G.state === 'ending'){ if (G.endLit) G.spin = clamp(G.spin + steps * 1.4, -9, 9); }
  else if (G.state === 'title') nudgeStart(); // a scroll can't unlock sound, so the run starts from the play button
  else if (G.state === 'dead' && G.deadT > 1.0){ if (steps > 0){ G.restartAcc += steps; if (G.restartAcc > 1.2){ G.restartAcc = 0; start(); } } }
}
window.addEventListener('wheel', e => {
  e.preventDefault();
  let d = e.deltaY + e.deltaX * .8; if (e.deltaMode === 1) d *= 33; else if (e.deltaMode === 2) d *= 600;
  feed(d * CFG.wheelK);
}, { passive: false });
let drag = null;
// Touch: swipe to walk, or press and hold near the right edge to go forward, near the left edge to go back (the middle stays for swiping).
canvas.addEventListener('pointerdown', e => { AU.init(); drag = { id: e.pointerId, x: e.clientX, y: e.clientY, x0: e.clientX, y0: e.clientY, t: performance.now(),
  hold: e.pointerType === 'mouse' ? 0 : e.clientX > window.innerWidth * .68 ? 1 : e.clientX < window.innerWidth * .32 ? -1 : 0 }; try { canvas.setPointerCapture(e.pointerId); } catch(_){} });
canvas.addEventListener('pointermove', e => {
  if (!drag || drag.id !== e.pointerId) return;
  const dy = drag.y - e.clientY, dx = e.clientX - drag.x; drag.x = e.clientX; drag.y = e.clientY;
  if (drag.hold && Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) > 14) drag.hold = 0; // it's a swipe, not a hold
  feed((Math.abs(dx) > Math.abs(dy) ? dx : dy) * CFG.dragK); // left→right or bottom→top = forward, the stronger axis wins
});
const endDrag = e => { if (drag && drag.id === e.pointerId) drag = null; };
canvas.addEventListener('pointerup', endDrag); canvas.addEventListener('pointercancel', endDrag);
document.addEventListener('touchmove', e => { if (e.target === canvas) e.preventDefault(); }, { passive: false });
const keys = {};
window.addEventListener('keydown', e => {
  AU.init();
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault();
  keys[e.key] = true;
  if (e.key === 'Escape' || e.key === 'p' || e.key === 'з') pause(G.state === 'play');
  if (e.code === 'KeyD') ui.dbg.hidden = !ui.dbg.hidden;
  if ((e.key === 'Enter' || e.key === ' ') && (G.state === 'title' || (G.state === 'dead' && G.deadT > 1))) start();
});
window.addEventListener('keyup', e => { keys[e.key] = false; });
$('startBtn').addEventListener('click', start);
$('againBtn').addEventListener('click', start);
$('pauseBtn').addEventListener('click', () => pause(true));
$('endAgain').addEventListener('click', () => { G.state = 'over'; start(); });
$('resumeBtn').addEventListener('click', () => pause(false));
ui.sfxBtn.addEventListener('click', () => { AU.unlock(); AU.setSfx(!AU.sfxOn); syncToggles(); });
ui.musBtn.addEventListener('click', () => { AU.unlock(); AU.setMusic(!AU.musOn); syncToggles(); });
function away(){ pause(true); AU.sleep(); }
function back(){ if (document.hidden || !document.hasFocus()) return; if (G.state === 'ending') AU.wake(); } // otherwise sound waits for a play / restart button
document.addEventListener('visibilitychange', () => { if (document.hidden) away(); else back(); });
window.addEventListener('blur', away);
window.addEventListener('focus', back);
window.addEventListener('pagehide', () => AU.sleep());
window.addEventListener('pageshow', back);
['touchend', 'click', 'keydown', 'pointerup'].forEach(ev => document.addEventListener(ev, () => { if (!AU.ok() && !document.hidden) AU.unlock(); }, { capture: true, passive: true }));
const sndPill = $('sndPill');
sndPill.addEventListener('click', () => { AU.unlock(); });
setInterval(() => { sndPill.hidden = !((AU.sfxOn || AU.musOn) && G.state !== 'title' && !AU.ok()); }, 500);

/* ============================== LOOP ============================== */
let camS = G.s, camY = G.s * CFG.H, zoom = 1;
const lampLocal = new T.Vector3(), tmpV = new T.Vector3();

function resize(){
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize); resize();

function placeCamera(dt){
  if (G.state === 'ending'){ camY = lerp(camY, ROOF_Y + .6, 1 - Math.exp(-dt * 1.2)); }
  else { camS = lerp(camS, G.s, 1 - Math.exp(-dt * 6)); camY = lerp(camY, G.s * CFG.H, 1 - Math.exp(-dt * 4)); }
  tower.rotation.y = CFG.base - camS * DA;
  const vf = camera.fov * Math.PI / 180, hf = 2 * Math.atan(Math.tan(vf / 2) * camera.aspect);
  zoom = lerp(zoom, G.state === 'ending' ? 1.9 : 1, 1 - Math.exp(-dt * .8));
  const dist = zoom * Math.max((CFG.viewW / 2) / Math.tan(hf / 2), (CFG.viewH / 2) / Math.tan(vf / 2));
  const target = new T.Vector3(.75, camY + 1.35, 1.1);
  const dir = new T.Vector3(.12, .36, 1).normalize();
  camera.position.copy(target).addScaledVector(dir, dist);
  camera.lookAt(target);
  scene.fog.near = dist - 2; scene.fog.far = dist + 22;
  const yb = Math.round(camY / 10) * 10, top = Math.min(yb + 35, ROOF_Y - .5), bot = yb - 35;
  core.scale.y = Math.max(.01, (top - bot) / 70); core.position.y = (top + bot) / 2;
  ground.rotation.y = tower.rotation.y; ground.position.y = -Math.max(0, camY - 3) * 1.6; ground.visible = camY < 14;
}

// Fog on floor 8: everything is veiled except a circle around the princess's lantern.
const _sp = new T.Vector3();
const _cp = new T.Vector3(), _cs = new T.Vector3(), _cw = new T.Vector3();
function updateCloudBank(){
  const gy = G.s * CFG.H, near = Math.abs(gy - 700 * CFG.H) < 14 || Math.abs(gy - 800 * CFG.H) < 14;
  cloudBank.visible = near && G.state !== 'ending'; if (!cloudBank.visible) return;
  girl.root.getWorldPosition(_cp); _cp.y += .6; const pd = _cp.distanceTo(camera.position);
  _cs.copy(_cp).project(camera); const px = _cs.x * camera.aspect, py = _cs.y;
  for (const sp of cloudBank.children){
    sp.getWorldPosition(_cw); const d3 = _cw.distanceTo(_cp), front = _cw.distanceTo(camera.position) < pd;
    let a = .8 * clamp((d3 - 1.8) / 2.5, 0, 1) * clamp((_cw.distanceTo(camera.position) - 7) / 6, 0, 1); // never wash over the camera
    if (front){ _cw.project(camera); const ds = Math.hypot(_cw.x * camera.aspect - px, _cw.y - py); a *= clamp((ds - .45) / .7, 0, 1); }
    sp.material.opacity = a;
  }
}
function updateMist(){
  const s = G.s, m = G.state === 'ending' ? 0 : clamp((s - 700) / 12, 0, 1) * clamp((800 - s) / 12, 0, 1);
  MIST.amt.value = m; ui.cloud.style.opacity = m.toFixed(3);
  if (m <= .001){ if (ui.mist.style.opacity !== '0') ui.mist.style.opacity = 0; return; }
  girl.lcore.getWorldPosition(MIST.pos.value);
  // light drifting puffs in front give the cloud some volume; the real fading is done per surface in 3D
  const t = G.t, W = window.innerWidth, Hh = window.innerHeight, puffs = [];
  for (let i = 0; i < 6; i++){
    const px = ((i * .37 + t * (.012 + i * .004)) % 1.3 - .15) * W, py = (.15 + ((i * .61) % 1) * .75) * Hh + Math.sin(t * .3 + i) * 30;
    const pr = (.22 + (i % 3) * .08) * Math.max(W, Hh);
    puffs.push(`radial-gradient(circle at ${px.toFixed(0)}px ${py.toFixed(0)}px, rgba(250,250,255,.28), rgba(250,250,255,0) ${pr.toFixed(0)}px)`);
  }
  ui.mist.style.background = puffs.join(',');
  ui.mist.style.opacity = m.toFixed(3);
}
function updateGirl(dt){
  const g = girl, s = G.s;
  place(g.root, s, CFG.RGIRL, 0); g.root.rotation.y = s * DA + Math.PI / 2 - .32;
  const ph = s * Math.PI;
  const moving = G.speed > .15 && G.state === 'play';
  const amp = clamp(G.speed / 4, 0, 1);
  if (G.state === 'dead'){
    G.sit = Math.min(1, G.sit + dt * 2.2); const e = ease(G.sit);
    g.legs.forEach(l => l.rotation.x = lerp(l.rotation.x, -1.35, e));
    g.body.position.y = -.28 * e; g.body.rotation.x = .08 * e; g.head.rotation.x = .25 * e;
  } else {
    g.legs[0].rotation.x = moving ? Math.sin(ph) * .55 : 0;
    g.legs[1].rotation.x = moving ? -Math.sin(ph) * .55 : 0;
    g.body.position.y = moving ? Math.abs(Math.sin(ph)) * .035 : Math.sin(G.t * 2) * .006;
    g.body.rotation.x = 0; g.head.rotation.x = 0;
    g.dressG.rotation.z = moving ? Math.sin(ph) * .05 : 0;
  }
  g.back.rotation.x = -amp * .22 + Math.sin(G.t * 2.2) * .03; g.back.rotation.z = Math.sin(G.t * 1.6) * .03; g.strands.forEach(st => st.rotation.x = -amp * .2);
  g.lamp.rotation.z = Math.sin(G.t * 2.4 + s) * .12 * (moving ? 1.6 : .6);
  g.lamp.rotation.x = Math.sin(G.t * 1.7) * .06 - amp * .15;
  if (G.flicker > 0) G.flicker -= dt;
  const fl = G.flicker > 0 ? (Math.random() < .5 ? .2 : 1) : 1;
  const ch = G.state === 'dead' ? Math.max(0, 1 - G.deadT * 1.4) : (.3 + .7 * G.charges / 3);
  const base = lerp(1.5, 2.1, skyState.night) * (1 + Math.sin(G.t * 5.3) * .04 + Math.sin(G.t * 13.1) * .02);
  g.light.intensity = base * ch * fl;
  g.halo.material.opacity = .6 * ch * fl;
  g.coreMat.color.set(PAL.lampCore).multiplyScalar(.3 + .7 * ch * fl);
}

let lastT = performance.now(), fpsAcc = 0, fpsN = 0, fps = 60;
function frame(now){
  requestAnimationFrame(frame);
  let dt = (now - lastT) / 1000; lastT = now; dt = clamp(dt, 0, 1 / 20);
  fpsAcc += dt; fpsN++; if (fpsAcc > .5){ fps = Math.round(fpsN / fpsAcc); fpsAcc = 0; fpsN = 0; }
  const simDt = G.state === 'paused' ? 0 : dt;
  G.t += simDt;

  if (G.state === 'play'){
    let kv = 0; if (keys.ArrowUp || keys.ArrowRight) kv += 1; if (keys.ArrowDown || keys.ArrowLeft) kv -= 1;

    const sub = Math.max(1, Math.ceil(Math.abs(move) / .2));
    for (let i = 1; i <= sub && G.state === 'play'; i++){
      const ss = G.s + move * i / sub;
      for (const h of hazards){ if (Math.abs(h.k - ss) < 6 && h.deadly(ss)){ G.s = ss; die(h.type); break; } }
    }
    if (G.state === 'play') G.s += move;
    if (G.s > G.maxS) G.maxS = G.s;
    const stepI = Math.floor(G.s);
    if (stepI !== G.lastStep){ AU.step(stepI); G.lastStep = stepI; }
    const sc = String(Math.floor(G.maxS)); if (ui.score.textContent !== sc) ui.score.textContent = sc;
    const fl = Math.floor(G.maxS / 100); if (fl > G.floor && fl < 10){ G.floor = fl; floorBanner(fl + 1); AU.musicBox(); AU.newProg(); ui.ribbon.classList.remove('bump'); void ui.ribbon.offsetWidth; ui.ribbon.classList.add('bump'); if (FLOOR_NOTES[fl + 1]) toast(FLOOR_NOTES[fl + 1], 3.4); }
    if (G.mult > 1 && G.s >= 700){ G.mult = 1; ui.multBadge.hidden = true; toast('Действие зелья закончилось', 2.4); }
    if (G.s >= ROOF_S - .4) startEnding();
    const anyChase = hazards.some(h => h.type === 'moths' && h.chasing);
    if (G.charges < 3 && !anyChase){ G.regen += dt; if (G.regen > 3.5){ G.regen = 0; G.charges++; renderCharges(); AU.lampBack(); } } else G.regen = 0;
    const mothNear = hazards.some(h => h.type === 'moths' && Math.abs(h.k - G.s) < 6);
    ui.charges.style.opacity = 0;
    for (const h of hazards){ if (h.first && !G.hinted[h.type] && h.k - G.s < 7 && h.k - G.s > -1){ G.hinted[h.type] = true; store.set('lg_hints2', G.hinted); toast(HINTS[h.type]); } }
  } else if (G.state === 'ending'){
    updateEnding(dt);
  } else if (G.state === 'dead'){
    G.deadT += dt; G.speed = 0;
    if (G.deadT > .9 && ui.overP.hidden) showOver();
  } else G.speed = 0;

  generate(G.s + CFG.genAhead); pruneHazards(G.s); syncSteps(G.s);
  updateSky(G.s);
  placeCamera(dt);
  if (G.state !== 'ending') updateGirl(dt); else { const L = girl; L.light.intensity = lerp(1.5, 2.1, skyState.night); L.lamp.rotation.z = Math.sin(G.t * 2.4) * .05; }
  updateMist(); updateCloudBank();

  tower.updateMatrixWorld(true);
  girl.lcore.getWorldPosition(tmpV); lampLocal.copy(tower.worldToLocal(tmpV));
  const ctx = { t: G.t, dt: simDt, s: G.s, speed: G.speed / G.mult, diff: clamp(G.s / 900, 0, 1), lamp: lampLocal }; // hazards judge the pace without the potion bonus
  if (simDt > 0) for (const h of hazards) if (Math.abs(h.k - G.s) < 50) h.update(ctx);

  girl.root.getWorldPosition(tmpV);
  moonLight.position.set(tmpV.x + 5.5, tmpV.y + 15, tmpV.z + 11); moonLight.target.position.copy(tmpV);

  for (const c of clouds){ const u = c.userData; u.a += u.sp * dt; const rel = ((u.y - camY) % 30 + 45) % 30 - 15; c.position.set(Math.sin(u.a) * u.r, camY + rel, -Math.abs(Math.cos(u.a)) * u.r - 4); c.rotation.y = u.a; }
  for (let i = 0; i < flyN; i++){ const f = flySeed[i]; const a = f[0] + G.t * .08 + Math.sin(G.t * .5 + f[3]) * .2; flyPos[i * 3] = Math.sin(a) * f[1]; flyPos[i * 3 + 1] = camY + f[2] + Math.sin(G.t * .7 + f[3]) * .4; flyPos[i * 3 + 2] = Math.cos(a) * f[1]; }
  flyGeo.attributes.position.needsUpdate = true;
  flies.material.size = .3 + Math.sin(G.t * 3) * .05;
  if ((shootT -= dt) < 0){ shootT = 7 + Math.random() * 9; shootingStar(); }

  if (toastTimer > 0){ toastTimer -= dt; if (toastTimer <= 0) ui.toast.classList.remove('on'); }
  if (floorTimer > 0){ floorTimer -= dt; if (floorTimer <= 0) ui.floor.classList.remove('on'); }
  if (!ui.dbg.hidden){
    const near = hazards.filter(h => Math.abs(h.k - G.s) < 8).map(h => `${h.type}@${h.k}${h.deadly(G.s) ? ' !' : ''}`).join('  ');
    ui.dbg.textContent = `fps ${fps}  s ${G.s.toFixed(2)}  v ${G.speed.toFixed(1)}  lamp ${G.charges}\n${near}`;
  }
  if (outline){ if ((outlineTick++ & 31) === 0) markOutlines(); outline.render(scene, camera); } else renderer.render(scene, camera);
}

reset(); G.state = 'title';
requestAnimationFrame(t => { lastT = t; frame(t); });
})();
